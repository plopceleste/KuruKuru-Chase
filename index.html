        const STORE_PREFIX = 'kurukuru';

        function readStore(key) {
          try {
            return localStorage.getItem(STORE_PREFIX + key);
          } catch {
            return null;
          }
        }

        function writeStore(key, value) {
          try {
            localStorage.setItem(STORE_PREFIX + key, String(value));
          } catch {
            return;
          }
        }

        function readStoreInt(key, fallback) {
          const value = parseInt(readStore(key), 10);
          return Number.isFinite(value) ? value : fallback;
        }

        const save = {
          get best() { return readStoreInt('Best', 0); },
          set best(value) { writeStore('Best', value); },

          get theme() { return readStoreInt('Theme', 0); },
          set theme(value) { writeStore('Theme', value); },

          get fpsLimit() {
            const value = readStoreInt('Fps', 60);
            return value === 30 || value === 60 ? value : 0;
          },
          set fpsLimit(value) { writeStore('Fps', value); },

          get crt() { return readStore('Crt') !== 'off'; },
          set crt(value) { writeStore('Crt', value ? 'on' : 'off'); }
        };

        function clamp(value, min, max) {
          return value < min ? min : value > max ? max : value;
        }

        function xmur3(text) {
          let h = 1779033703 ^ text.length;
          for (let i = 0; i < text.length; i++) {
            h = Math.imul(h ^ text.charCodeAt(i), 3432918353);
            h = (h << 13) | (h >>> 19);
          }
          return () => {
            h = Math.imul(h ^ (h >>> 16), 2246822507);
            h = Math.imul(h ^ (h >>> 13), 3266489909);
            return (h ^= h >>> 16) >>> 0;
          };
        }

        function mulberry32(a) {
          return () => {
            let t = (a += 0x6d2b79f5);
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function seededRandom(seed) {
          return mulberry32(xmur3(seed)());
        }

        const CARVE_STEPS = [{x: 0, y: -2}, {x: 0, y: 2}, {x: -2, y: 0}, {x: 2, y: 0}];

        const EXTRA_HOLES = 20;
        const FAST_CHANCE = 0.15;
        const MUD_CHANCE = 0.30;
        const ORB_CHANCE = 0.02;
        const MIN_ORBS = 2;
        const SAFE_RADIUS = 4;
        const GHOST_CLEARANCE = 10;
        const MAX_GHOSTS = 8;

        function shuffle(list, rng) {
          for (let i = list.length - 1; i > 0; i--) {
            const j = Math.floor(rng() * (i + 1));
            [list[i], list[j]] = [list[j], list[i]];
          }
          return list;
        }

        function carve(maze, x, y, rng) {
          maze[y][x] = FLOOR;
          for (const step of shuffle(CARVE_STEPS.slice(), rng)) {
            const nx = x + step.x;
            const ny = y + step.y;
            if (nx > 0 && nx < MAZE_W - 1 && ny > 0 && ny < MAZE_H - 1 && maze[ny][nx] === WALL) {
              maze[y + step.y / 2][x + step.x / 2] = FLOOR;
              carve(maze, nx, ny, rng);
            }
          }
        }

        function floodFill(maze, from) {
          const cells = MAZE_W * MAZE_H;
          const dist = new Int32Array(cells).fill(-1);
          const queue = new Int32Array(cells);
          let head = 0;
          let tail = 0;

          const startCell = from.y * MAZE_W + from.x;
          dist[startCell] = 0;
          queue[tail++] = startCell;

          while (head < tail) {
            const cell = queue[head++];
            const x = cell % MAZE_W;
            const y = (cell / MAZE_W) | 0;
            for (const dir of DIRS) {
              const nx = x + dir.x;
              const ny = y + dir.y;
              if (nx < 0 || nx >= MAZE_W || ny < 0 || ny >= MAZE_H) continue;
              const next = ny * MAZE_W + nx;
              if (maze[ny][nx] === WALL || dist[next] >= 0) continue;
              dist[next] = dist[cell] + 1;
              queue[tail++] = next;
            }
          }

          return dist;
        }

        function generateFloor(floor, rng, quotaRate) {
          const maze = [];
          for (let y = 0; y < MAZE_H; y++) {
            maze[y] = new Array(MAZE_W).fill(WALL);
          }

          carve(maze, 1, 1, rng);

          for (let i = 0; i < EXTRA_HOLES; i++) {
            const x = Math.floor(rng() * (MAZE_W - 2)) + 1;
            const y = Math.floor(rng() * (MAZE_H - 2)) + 1;
            if (maze[y][x] === WALL) maze[y][x] = FLOOR;
          }

          const empties = [];
          for (let y = 1; y < MAZE_H - 1; y++) {
            for (let x = 1; x < MAZE_W - 1; x++) {
              if (maze[y][x] === FLOOR) empties.push({x, y});
            }
          }

          const start = empties[Math.floor(rng() * empties.length)];
          const dist = floodFill(maze, start);
          const reachable = empties.filter((p) => dist[p.y * MAZE_W + p.x] >= 0);

          let gate = start;
          let gateDist = -1;
          for (const p of reachable) {
            const d = dist[p.y * MAZE_W + p.x];
            if (d > gateDist) { gateDist = d; gate = p; }
          }

          const isGate = (p) => p.x === gate.x && p.y === gate.y;

          for (const p of reachable) {
            if (isGate(p)) continue;
            const roll = rng();
            if (roll < FAST_CHANCE) maze[p.y][p.x] = FAST;
            else if (roll < MUD_CHANCE) maze[p.y][p.x] = MUD;
          }

          const coins = [];
          const orbs = [];
          for (const p of reachable) {
            if (isGate(p)) continue;
            if (Math.abs(p.x - start.x) <= SAFE_RADIUS && Math.abs(p.y - start.y) <= SAFE_RADIUS) continue;
            if (rng() < ORB_CHANCE) orbs.push({x: p.x, y: p.y});
            else coins.push({x: p.x, y: p.y});
          }

          while (orbs.length < MIN_ORBS && coins.length > 1) {
            let far = 0;
            let farDist = -1;
            for (let i = 0; i < coins.length; i++) {
              const d = dist[coins[i].y * MAZE_W + coins[i].x];
              if (d > farDist) { farDist = d; far = i; }
            }
            orbs.push(coins.splice(far, 1)[0]);
          }

          const ghosts = [];
          const ghostCount = Math.min(MAX_GHOSTS, 3 + Math.floor((floor - 1) / 2));
          for (let i = 0; i < ghostCount; i++) {
            let spot;
            let tries = 0;
            do {
              spot = reachable[Math.floor(rng() * reachable.length)];
              tries++;
            } while (Math.hypot(spot.x - start.x, spot.y - start.y) < GHOST_CLEARANCE && tries < 50);
            ghosts.push({x: spot.x, y: spot.y});
          }

          return {
            maze,
            start,
            gate: {x: gate.x, y: gate.y, open: false},
            coins,
            orbs,
            ghosts,
            totalCoins: coins.length,
            quota: Math.max(1, Math.ceil(coins.length * quotaRate))
          };
        }

        const openList = [];
        const openAt = new Array(MAZE_W * MAZE_H).fill(null);
        const closed = new Uint8Array(MAZE_W * MAZE_H);
        const nodePool = [];
        const stepPool = [];
        const path = [];
        let nodesUsed = 0;

        const MAX_ITERATIONS = 250;

        function pathNode(x, y, g, h, parent) {
          let node = nodePool[nodesUsed];
          if (!node) {
            node = {x: 0, y: 0, g: 0, h: 0, f: 0, parent: null};
            nodePool[nodesUsed] = node;
          }
          nodesUsed++;
          node.x = x;
          node.y = y;
          node.g = g;
          node.h = h;
          node.f = g + h;
          node.parent = parent;
          return node;
        }

        function findPath(sx, sy, ex, ey, maze) {
          if (ex < 0 || ex >= MAZE_W || ey < 0 || ey >= MAZE_H || maze[ey][ex] === WALL) return null;

          nodesUsed = 0;
          for (let i = 0; i < openList.length; i++) {
            openAt[openList[i].y * MAZE_W + openList[i].x] = null;
          }
          openList.length = 0;
          closed.fill(0);

          const start = pathNode(sx, sy, 0, 0, null);
          openList.push(start);
          openAt[sy * MAZE_W + sx] = start;

          for (let iterations = 0; openList.length > 0 && iterations < MAX_ITERATIONS; iterations++) {
            let low = 0;
            for (let i = 1; i < openList.length; i++) {
              if (openList[i].f < openList[low].f) low = i;
            }
            let current = openList[low];

            if (current.x === ex && current.y === ey) {
              let n = 0;
              while (current.parent) {
                let step = stepPool[n];
                if (!step) { step = {x: 0, y: 0}; stepPool[n] = step; }
                step.x = current.x;
                step.y = current.y;
                n++;
                current = current.parent;
              }
              path.length = n;
              for (let i = 0; i < n; i++) path[i] = stepPool[n - 1 - i];
              return path;
            }

            openList.splice(low, 1);
            openAt[current.y * MAZE_W + current.x] = null;
            closed[current.y * MAZE_W + current.x] = 1;

            for (let d = 0; d < DIRS.length; d++) {
              const nx = current.x + DIRS[d].x;
              const ny = current.y + DIRS[d].y;
              if (nx < 0 || nx >= MAZE_W || ny < 0 || ny >= MAZE_H) continue;
              const cell = ny * MAZE_W + nx;
              if (maze[ny][nx] === WALL || closed[cell]) continue;

              const g = current.g + 1;
              const existing = openAt[cell];
              if (!existing) {
                const fresh = pathNode(nx, ny, g, Math.abs(nx - ex) + Math.abs(ny - ey), current);
                openList.push(fresh);
                openAt[cell] = fresh;
              } else if (g < existing.g) {
                existing.g = g;
                existing.f = g + existing.h;
                existing.parent = current;
              }
            }
          }

          return null;
        }

        const CHORDS = {
          Am: {root: 57, triad: [57, 60, 64]},
          F: {root: 53, triad: [53, 57, 60]},
          C: {root: 48, triad: [48, 52, 55]},

        const SECTION_A = {

          drums: ['full', 'full', 'full', 'full', 'full', 'full', 'full', 'full'],
          bass: 'drive', bassWalk: -1, arp: true, stabs: false, pad: 0.05,
          lead: [
            [[0, 69, 2], [2, 72, 2], [4, 76, 2], [6, 74, 2], [8, 72, 2], [10, 76, 2], [12, 81, 4]],

        const SECTION_B = {

            [[0, 81, 6], [6, 79, 2], [8, 77, 4], [12, 79, 4]],
            [[0, 76, 6], [6, 74, 2], [8, 72, 4], [12, 76, 4]],
            [[0, 74, 8], [8, 71, 4], [12, 74, 4]],
            [[0, 77, 6], [6, 79, 2], [8, 81, 4], [12, 79, 2], [14, 77, 2]],
            [[0, 84, 6], [6, 81, 2], [8, 79, 4], [12, 81, 4]],

            [[8, 69, 2], [10, 67, 2], [12, 65, 4]],
            [[8, 64, 2], [10, 62, 2], [12, 60, 4]],
            [[8, 62, 2], [10, 64, 2], [12, 67, 4]],
            [[8, 65, 2], [10, 67, 2], [12, 69, 4]],
            [[8, 69, 2], [10, 71, 2], [12, 72, 4]],
            [[8, 71, 2], [10, 68, 2], [12, 64, 4]],
            []
          ]
        };

        const SECTION_C = {
          chords: [CHORDS.Am, CHORDS.F, CHORDS.C, CHORDS.G, CHORDS.Am, CHORDS.F, CHORDS.E, CHORDS.E],
          drums: ['sparse', 'sparse', 'sparse', 'sparse', 'sparse', 'sparse', 'sparse', 'fill'],
          bass: 'half', bassWalk: 7, arp: false, stabs: false, pad: 0.085,
          lead: [
            [[0, 69, 2], [2, 72, 2], [4, 76, 4]],
            [[8, 77, 2], [10, 76, 2], [12, 72, 4]],
            [],
            [[8, 74, 2], [10, 76, 2], [12, 79, 4]],
            [[0, 69, 2], [2, 72, 2], [4, 76, 2], [6, 81, 6]],
            [[8, 81, 2], [10, 79, 2], [12, 77, 4]],
            [[0, 80, 4], [4, 83, 4]],
            []
          ],
          counter: [
            [],
            [],
            [[0, 64, 2], [2, 67, 2], [4, 72, 4]],
            [],
            [],
            [[8, 72, 2], [10, 74, 2], [12, 76, 4]],
            [[8, 68, 2], [10, 71, 2], [12, 76, 4]],
            []
          ]
        };

        const FORM = [SECTION_A, SECTION_A, SECTION_B, SECTION_A, SECTION_C, SECTION_A, SECTION_B, SECTION_A];
        const BPM = 160;
        const STEP_SECONDS = 60 / BPM / 4;
        const TOTAL_STEPS = FORM.length * 128;
        const SCHEDULE_AHEAD = 0.18;
        const SCHEDULE_TICK = 25;
        const NOISE_SECONDS = 2;

        class AudioEngine {
          constructor() {
            this.ctx = null;
            this.master = null;
            this.musicBus = null;
            this.leadBus = null;
            this.sfxBus = null;
            this.enabled = true;
            this.mood = 'full';
            this.coinFlip = false;
            this.musicStarted = false;
            this.musicTimer = null;
            this.nextNoteTime = 0;
            this.step = 0;
            this.noiseBuffer = null;

            document.addEventListener('visibilitychange', () => {
              if (!this.ctx || !this.enabled) return;
              if (document.hidden) {
                clearTimeout(this.musicTimer);
                this.ctx.suspend();
              } else {
                this.ctx.resume();
                if (this.musicStarted) {
                  this.nextNoteTime = this.ctx.currentTime + 0.08;
                  this.scheduleMusic();
                }
              }
            });
          }

          init() {
            if (this.ctx) return;
            try {
              const Ctx = window.AudioContext || window.webkitAudioContext;
              if (!Ctx) return;
              this.ctx = new Ctx();

              const comp = this.ctx.createDynamicsCompressor();
              comp.threshold.value = -14;
              comp.knee.value = 24;
              comp.ratio.value = 6;
              comp.attack.value = 0.003;
              comp.release.value = 0.2;

              this.master = this.ctx.createGain();
              this.master.gain.value = 0.8;
              this.musicBus = this.ctx.createGain();
              this.musicBus.gain.value = 0.55;
              this.sfxBus = this.ctx.createGain();
              this.sfxBus.gain.value = 0.85;

              const muffle = this.ctx.createBiquadFilter();
              muffle.type = 'lowpass';
              muffle.frequency.value = 1200;
              muffle.Q.value = 0.7;

              this.musicBus.connect(muffle);
              muffle.connect(this.master);
              this.sfxBus.connect(this.master);
              this.master.connect(comp);
              comp.connect(this.ctx.destination);

              this.leadBus = this.ctx.createGain();
              this.leadBus.gain.value = 1;
              this.leadBus.connect(this.musicBus);

              const delay = this.ctx.createDelay(1);
              delay.delayTime.value = STEP_SECONDS * 3;
              const feedback = this.ctx.createGain();
              feedback.gain.value = 0.32;
              const delayLowpass = this.ctx.createBiquadFilter();
              delayLowpass.type = 'lowpass';
              delayLowpass.frequency.value = 2200;
              const wet = this.ctx.createGain();
              wet.gain.value = 0.35;

              this.leadBus.connect(delay);
              delay.connect(delayLowpass);
              delayLowpass.connect(feedback);
              feedback.connect(delay);
              delayLowpass.connect(wet);
              wet.connect(this.musicBus);
            } catch {
              this.ctx = null;
            }
          }

          unlock() {
            this.init();
            if (!this.ctx) return;
            if (this.ctx.state === 'suspended') this.ctx.resume();
            this.startMusic();
          }

          toggle() {
            this.enabled = !this.enabled;
            if (!this.ctx) return;
            if (this.enabled) {
              if (this.ctx.state === 'suspended') this.ctx.resume();
              if (this.musicStarted) {
                this.nextNoteTime = this.ctx.currentTime + 0.08;
                this.scheduleMusic();
              }
            } else {
              this.ctx.suspend();
              clearTimeout(this.musicTimer);
            }
          }

          setMood(mood) {
            this.mood = mood;
          }

          mtof(midi) {
            return 440 * Math.pow(2, (midi - 69) / 12);
          }

          startMusic() {
            this.musicStarted = true;
            if (!this.ctx || !this.enabled) return;
            if (this.ctx.state === 'suspended') this.ctx.resume();
            this.step = 0;
            this.nextNoteTime = this.ctx.currentTime + 0.08;
            this.scheduleMusic();
          }

          scheduleMusic() {
            clearTimeout(this.musicTimer);
            if (!this.enabled || !this.ctx || !this.musicStarted) return;
            while (this.nextNoteTime < this.ctx.currentTime + SCHEDULE_AHEAD) {
              this.playStep(this.step, this.nextNoteTime, STEP_SECONDS);
              this.step = (this.step + 1) % TOTAL_STEPS;
              this.nextNoteTime += STEP_SECONDS;
            }
            this.musicTimer = setTimeout(() => this.scheduleMusic(), SCHEDULE_TICK);
          }

          playStep(step, t, stepDur) {
            const globalBar = Math.floor(step / 16);
            const section = FORM[Math.floor(globalBar / 8)];
            const bar = globalBar % 8;
            const s = step % 16;
            const chord = section.chords[bar];
            const nextBar = (globalBar + 1) % (FORM.length * 8);
            const nextChord = FORM[Math.floor(nextBar / 8)].chords[nextBar % 8];
            const mood = this.mood;
            const style = mood === 'calm' ? 'calm' : section.drums[bar];

            if (style === 'full') {
              if (s % 4 === 0) this.kick(t);
              if (s === 4 || s === 12) this.snare(t);
              if (s % (mood === 'frenzy' ? 1 : 2) === 0) this.hat(t, s === 14);
            } else if (style === 'fill') {
              if (s % 4 === 0 && s < 8) this.kick(t);
              if (s === 4) this.snare(t);
              if (s < 8 && s % 2 === 0) this.hat(t, false);
              if (s >= 8 && (s >= 12 || s % 2 === 0)) this.snare(t, 0.16 + (s - 8) * 0.035);
            } else if (style === 'sparse') {
              if (s === 0 || s === 8) this.kick(t);
              if (s % 2 === 0) this.hat(t, false, 0.09);
            } else if (s % 4 === 0) {
              this.hat(t, false, 0.05);
            }

            const root = chord.root - 12;
            if (mood === 'calm' || (section.bass === 'half' && style !== 'fill')) {
              if (s === 0 || s === 8) {
                this.synth(t, {
                  freq: this.mtof(root), type: 'sawtooth', dur: stepDur * 7.5, vol: 0.24,
                  a: 0.008, d: 0.08, s: 0.8, r: 0.2, filterFreq: 380, filterQ: 2, bus: this.musicBus
                });
              }
            } else if (section.bassWalk === bar) {
              if (s % 2 === 0) {
                this.synth(t, {
                  freq: this.mtof(root + [0, 0, 0, 0, 2, 2, 4, 4][s / 2]), type: 'sawtooth',
                  dur: stepDur * 1.9, vol: 0.32, a: 0.005, d: 0.05, s: 0.7, r: 0.05,
                  filterFreq: 560, filterEnv: 200, filterQ: 4, bus: this.musicBus
                });
              }
            } else if (s % 2 === 0) {
              let midi = (s === 4 || s === 12) ? chord.root : root;
              if (s === 14 && nextChord.root !== chord.root) midi = nextChord.root - 13;
              this.synth(t, {
                freq: this.mtof(midi), type: 'sawtooth', dur: stepDur * 1.9, vol: 0.32,
                a: 0.005, d: 0.05, s: 0.7, r: 0.05,
                filterFreq: mood === 'frenzy' ? 950 : 540, filterEnv: 200, filterQ: 4, bus: this.musicBus
              });
            }

            this.melody(t, section.lead[bar], s, stepDur, mood === 'calm' ? 0.1 : 0.16);
            this.melody(t, section.counter[bar], s, stepDur, mood === 'calm' ? 0.07 : 0.11);

            if (section.arp && mood !== 'calm') {
              this.synth(t, {
                freq: this.mtof(chord.triad[[0, 1, 2, 1][s % 4]] + 12), type: 'square',
                dur: stepDur * 0.8, vol: mood === 'frenzy' ? 0.1 : 0.05,
                a: 0.002, d: 0.02, s: 0.3, r: 0.02, filterFreq: 2600, filterQ: 1, bus: this.musicBus
              });
            }

            if ((section.stabs || mood === 'frenzy') && s % 4 === 2 && style !== 'fill') {
              for (const midi of chord.triad) {
                this.synth(t, {
                  freq: this.mtof(midi + 12), type: 'square', dur: 0.08, vol: 0.04,
                  a: 0.002, d: 0.03, s: 0.2, r: 0.02, bus: this.musicBus
                });
              }
            }

            if (s === 0) {
              const padVol = mood === 'calm' ? 0.1 : section.pad;
              for (const midi of chord.triad) {
                this.synth(t, {
                  freq: this.mtof(midi), type: 'sawtooth', dur: stepDur * 15, vol: padVol,
                  a: 0.06, d: 0.2, s: 0.85, r: 0.35, filterFreq: 900, filterQ: 1, bus: this.musicBus
                });
              }
            }
          }

          melody(t, notes, s, stepDur, vol) {
            for (const note of notes) {
              if (note[0] !== s) continue;
              this.synth(t, {
                freq: this.mtof(note[1]), type: 'square', dur: note[2] * stepDur * 0.92, vol,
                a: 0.003, d: 0.03, s: 0.55, r: 0.04, unison: 6,
                filterFreq: 3400, filterQ: 0.8, bus: this.leadBus
              });
            }
          }

          kick(t) {
            this.synth(t, {freq: 150, glideTo: 45, type: 'sine', dur: 0.16, vol: 0.95, a: 0.001, d: 0.06, s: 0.2, r: 0.05, bus: this.musicBus});
            this.synth(t, {freq: 900, glideTo: 200, type: 'triangle', dur: 0.03, vol: 0.3, a: 0.001, d: 0.02, s: 0.01, r: 0.01, bus: this.musicBus});
          }

          snare(t, vol = 0.45) {
            this.noise(t, 0.14, vol, 'highpass', 1400, 900, this.musicBus);
            this.synth(t, {freq: 190, type: 'triangle', dur: 0.12, vol: vol * 0.6, a: 0.001, d: 0.05, s: 0.1, r: 0.05, bus: this.musicBus});
          }

          hat(t, open, vol) {
            this.noise(t, open ? 0.11 : 0.04, vol ?? (open ? 0.16 : 0.13), 'highpass', 8000, 6000, this.musicBus);
          }

          synth(t, o) {
            if (!this.enabled || !this.ctx) return;
            const dur = o.dur ?? 0.2;
            const gain = this.ctx.createGain();
            this.envelope(gain, t, o.vol ?? 0.3, dur, o.a, o.d, o.s, o.r);

            let dest = gain;
            if (o.filterFreq) {
              const filter = this.ctx.createBiquadFilter();
              filter.type = o.filterType || 'lowpass';
              filter.frequency.setValueAtTime(o.filterFreq, t);
              if (o.filterEnv) filter.frequency.exponentialRampToValueAtTime(Math.max(60, o.filterEnv), t + dur);
              filter.Q.value = o.filterQ ?? 1;
              filter.connect(gain);
              dest = filter;
            }
            gain.connect(o.bus || this.sfxBus);

            const osc = (detune) => {
              const node = this.ctx.createOscillator();
              node.type = o.type || 'square';
              node.frequency.setValueAtTime(o.freq, t);
              if (o.glideTo) node.frequency.exponentialRampToValueAtTime(Math.max(1, o.glideTo), t + dur);
              if (detune) node.detune.value = detune;
              node.connect(dest);
              node.start(t);
              node.stop(t + dur + 0.05);
            };

            osc(o.detune || 0);
            if (o.unison) osc(o.unison);
          }

          envelope(gain, t, vol, dur, a = 0.004, d = 0.04, s = 0.6, r = 0.06) {
            const peak = Math.max(0.0001, vol);
            const sustain = Math.max(0.0001, vol * s);
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(peak, t + a);
            gain.gain.exponentialRampToValueAtTime(sustain, t + a + d);
            gain.gain.setValueAtTime(sustain, Math.max(t + a + d, t + dur - r));
            gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          }

          noiseTable() {
            if (!this.noiseBuffer) {
              const length = Math.max(1, Math.floor(this.ctx.sampleRate * NOISE_SECONDS));
              this.noiseBuffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
              const data = this.noiseBuffer.getChannelData(0);
              for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
            }
            return this.noiseBuffer;
          }

          noise(t, dur, vol, filterType, from, to, bus) {
            if (!this.enabled || !this.ctx) return;
            const source = this.ctx.createBufferSource();
            source.buffer = this.noiseTable();

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(vol, t);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

            if (filterType) {
              const filter = this.ctx.createBiquadFilter();
              filter.type = filterType;
              filter.frequency.setValueAtTime(from || 1000, t);
              if (to) filter.frequency.exponentialRampToValueAtTime(Math.max(60, to), t + dur);
              source.connect(filter);
              filter.connect(gain);
            } else {
              source.connect(gain);
            }
            gain.connect(bus || this.sfxBus);

            source.start(t, Math.random() * Math.max(0, NOISE_SECONDS - dur - 0.05));
            source.stop(t + dur + 0.02);
          }

          get now() {
            return this.ctx ? this.ctx.currentTime : 0;
          }

          coin() {
            if (!this.enabled || !this.ctx) return;
            this.coinFlip = !this.coinFlip;
            const base = this.coinFlip ? 520 : 380;
            this.synth(this.now, {freq: base, glideTo: base * 0.72, type: 'square', dur: 0.075, vol: 0.22, a: 0.001, d: 0.03, s: 0.25, r: 0.02});
          }

          orb() {
            if (!this.enabled || !this.ctx) return;
            const t = this.now;
            this.synth(t, {freq: 200, glideTo: 900, type: 'sawtooth', dur: 0.5, vol: 0.3, a: 0.01, d: 0.1, s: 0.6, r: 0.15, filterFreq: 400, filterEnv: 3200, filterQ: 6, unison: 8});
            [0, 4, 7, 12].forEach((iv, i) => this.synth(t + 0.06 * i, {freq: this.mtof(69 + iv), type: 'square', dur: 0.12, vol: 0.16, a: 0.001, d: 0.04, s: 0.3, r: 0.03}));
          }

          catchGhost() {
            if (!this.enabled || !this.ctx) return;
            const t = this.now;
            [0, 4, 7, 12].forEach((iv, i) => this.synth(t + i * 0.05, {freq: this.mtof(72 + iv), type: 'square', dur: 0.12, vol: 0.26, a: 0.001, d: 0.04, s: 0.35, r: 0.04, unison: 5}));
            this.noise(t, 0.06, 0.15, 'highpass', 6000, 3000);
          }

          hurt() {
            if (!this.enabled || !this.ctx) return;
            const t = this.now;
            this.synth(t, {freq: 240, glideTo: 55, type: 'sawtooth', dur: 0.3, vol: 0.4, a: 0.001, d: 0.1, s: 0.4, r: 0.12, filterFreq: 1400, filterEnv: 180, filterQ: 3});
            this.synth(t, {freq: 254, glideTo: 62, type: 'square', dur: 0.26, vol: 0.2, a: 0.001, d: 0.08, s: 0.3, r: 0.1});
            this.noise(t, 0.18, 0.3, 'lowpass', 900, 300);
          }

          die() {
            if (!this.enabled || !this.ctx) return;
            const t = this.now;
            const fall = [72, 70, 67, 65, 62, 60, 57, 53];
            fall.forEach((midi, i) => this.synth(t + i * 0.09, {freq: this.mtof(midi), type: 'square', dur: 0.12, vol: 0.3, a: 0.001, d: 0.05, s: 0.35, r: 0.05}));
            this.synth(t + fall.length * 0.09, {freq: this.mtof(45), glideTo: this.mtof(31), type: 'sawtooth', dur: 0.7, vol: 0.4, a: 0.005, d: 0.2, s: 0.6, r: 0.3, filterFreq: 1000, filterEnv: 120, unison: 9});
          }

          dash() {
            if (!this.enabled || !this.ctx) return;
            const t = this.now;
            this.noise(t, 0.22, 0.3, 'lowpass', 5200, 320);
            this.synth(t, {freq: 720, glideTo: 190, type: 'sawtooth', dur: 0.18, vol: 0.18, a: 0.001, d: 0.06, s: 0.3, r: 0.05, filterFreq: 2200, filterEnv: 320});
          }

          skill() {
            if (!this.enabled || !this.ctx) return;
            const t = this.now;
            this.synth(t, {freq: 110, glideTo: 880, type: 'sawtooth', dur: 0.25, vol: 0.3, a: 0.01, d: 0.1, s: 0.7, r: 0.05, filterFreq: 300, filterEnv: 4200, filterQ: 5, unison: 10});
            [0, 7, 12].forEach((iv) => this.synth(t + 0.2, {freq: this.mtof(69 + iv), type: 'square', dur: 0.4, vol: 0.22, a: 0.002, d: 0.08, s: 0.5, r: 0.12, unison: 7}));
            this.noise(t + 0.2, 0.3, 0.25, 'lowpass', 2200, 200);
          }

          gate() {
            if (!this.enabled || !this.ctx) return;
            const t = this.now;
            [57, 64, 69, 76].forEach((midi, i) => this.synth(t + i * 0.07, {freq: this.mtof(midi), type: 'square', dur: 0.16, vol: 0.24, a: 0.002, d: 0.05, s: 0.45, r: 0.06, unison: 6}));
            this.noise(t + 0.2, 0.25, 0.12, 'highpass', 5000, 8000);
          }

          warden() {
            if (!this.enabled || !this.ctx) return;
            const t = this.now;
            [0, 1, 2, 3].forEach((i) => this.synth(t + i * 0.16, {freq: i % 2 ? 311 : 415, type: 'sawtooth', dur: 0.15, vol: 0.32, a: 0.002, d: 0.04, s: 0.6, r: 0.04, filterFreq: 1600, filterQ: 3, unison: 8}));
            this.synth(t + 0.66, {freq: 415, glideTo: 92, type: 'sawtooth', dur: 0.5, vol: 0.3, a: 0.004, d: 0.1, s: 0.5, r: 0.2, filterFreq: 1200, filterEnv: 150, unison: 9});
          }

          clear() {
            if (!this.enabled || !this.ctx) return;
            const t = this.now;
            [60, 64, 67, 72].forEach((midi, i) => this.synth(t + i * 0.1, {freq: this.mtof(midi), type: 'square', dur: 0.18, vol: 0.3, a: 0.002, d: 0.05, s: 0.5, r: 0.06, unison: 5}));
            [72, 76, 79].forEach((midi) => this.synth(t + 0.42, {freq: this.mtof(midi), type: 'square', dur: 0.6, vol: 0.24, a: 0.004, d: 0.1, s: 0.6, r: 0.2, unison: 6}));
          }

          pick() {
            if (!this.enabled || !this.ctx) return;
            const t = this.now;

uniform vec2 uSignalRes;

const float hardScan = -6.0;
const float hardPix = -4.5;

float ToLinear1 (float c) { return (c <= 0.04045) ? c / 12.92 : pow((c + 0.055) / 1.055, 2.4); }

{

    if (max(abs(pos.x - 0.5), abs(pos.y - 0.5)) > 0.5) return vec3(0.0);

vec2 Dist (vec2 pos, vec2 r) { pos = pos * r; return -((pos - floor(pos)) - vec2(0.5)); }

vec3 Horz3 (vec2 pos, float off, vec2 r, float scale)
{
    vec3 b = Fetch(pos, vec2(-1.0, off), r);

    vec3 d = Fetch(pos, vec2(1.0, off), r);

    float wb = Gaus(dst - 1.0, scale);
    float wc = Gaus(dst, scale);
    float wd = Gaus(dst + 1.0, scale);

    vec3 b = Fetch(pos, vec2(-1.0, off), r);
    vec3 c = Fetch(pos, vec2(0.0, off), r);

    float wd = Gaus(dst + 1.0, scale);

          if (!complete) return;

          gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
          gl.disable(gl.DEPTH_TEST);
          gl.disable(gl.BLEND);

          crt.gl = gl;
          crt.resolve = resolve;
          crt.tube = glass;
          crt.source = source;
          crt.signal = signal;
          crt.buffer = buffer;
          crt.quad = quad;
          crt.ready = true;
        }

        function drawQuad(gl, handle) {
          gl.bindBuffer(gl.ARRAY_BUFFER, crt.quad);
          gl.enableVertexAttribArray(handle.position);
          gl.vertexAttribPointer(handle.position, 2, gl.FLOAT, false, 0, 0);
          gl.drawArrays(gl.TRIANGLES, 0, 6);
        }

        function presentCrt() {
          const gl = crt.gl;
          if (gl.isContextLost()) return;

          gl.bindTexture(gl.TEXTURE_2D, crt.source);
          gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, view);

          gl.bindFramebuffer(gl.FRAMEBUFFER, crt.buffer);
          gl.viewport(0, 0, SIGNAL_W, SIGNAL_H);
          gl.useProgram(crt.resolve.program);
          gl.uniform1i(crt.resolve.uMainSampler, 0);
          gl.uniform2f(crt.resolve.uSourceRes, VIEW_W, VIEW_H);
          gl.uniform2f(crt.resolve.uTargetRes, SIGNAL_W, SIGNAL_H);
          drawQuad(gl, crt.resolve);

          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.bindTexture(gl.TEXTURE_2D, crt.signal);
          gl.viewport(0, 0, tube.width, tube.height);
          gl.useProgram(crt.tube.program);
          gl.uniform1i(crt.tube.uMainSampler, 0);
          gl.uniform2f(crt.tube.uSignalRes, SIGNAL_W, SIGNAL_H);
          gl.uniform2f(crt.tube.uOutputRes, tube.width, tube.height);
          drawQuad(gl, crt.tube);
        }

        function setCrt(enabled) {
          crt.enabled = enabled && crt.ready;
          stage.classList.toggle('crt', crt.enabled);
        }

        function watchContextLoss() {
          tube.addEventListener('webglcontextlost', (event) => {
            event.preventDefault();
            crt.ready = false;
            setCrt(false);
          });

          tube.addEventListener('webglcontextrestored', () => {
            initCrt();
            setCrt(save.crt);
          });
        }

        let frameInterval = 0;

        function setFrameLimit(fps) {
          save.fpsLimit = fps;
          frameInterval = fps ? (1000 / fps) * 0.95 : 0;
        }

        function layout() {
          const box = shell.getBoundingClientRect();
          const scale = Math.min(box.width / VIEW_W, box.height / VIEW_H);
          const width = Math.max(1, Math.round(VIEW_W * scale));
          const height = Math.max(1, Math.round(VIEW_H * scale));

          stage.style.width = `${width}px`;
          stage.style.height = `${height}px`;

          const ratio = Math.min(window.devicePixelRatio || 1, 2);
          const pixelW = Math.max(1, Math.round(width * ratio));
          const pixelH = Math.max(1, Math.round(height * ratio));
          if (tube.width !== pixelW || tube.height !== pixelH) {
            tube.width = pixelW;
            tube.height = pixelH;
          }
        }

        function fillRect(x, y, w, h, color, alpha) {
          const previous = ctx.globalAlpha;
          if (alpha !== undefined) ctx.globalAlpha = previous * alpha;
          ctx.fillStyle = color;
          ctx.fillRect(x, y, w, h);
          ctx.globalAlpha = previous;
        }

        function strokeRect(x, y, w, h, color, width = 2) {
          ctx.strokeStyle = color;
          ctx.lineWidth = width;
          ctx.strokeRect(x, y, w, h);
        }

        function measure(content, size) {
          ctx.font = `${Math.round(size)}px ${FONT}`;
          return ctx.measureText(content).width;
        }

        function fitSize(content, size, maxWidth) {
          let value = Math.round(size);
          while (value > 6 && measure(content, value) > maxWidth) value -= 1;
          return value;
        }

        function label(x, y, content, options = {}) {
          const requested = options.size || F;
          const size = options.maxWidth ? fitSize(content, requested, options.maxWidth) : Math.round(requested);
          const originX = options.originX ?? 0.5;
          ctx.font = `${size}px ${FONT}`;
          ctx.fillStyle = options.color || PALETTE.paper;
          ctx.textAlign = originX === 0 ? 'left' : originX === 1 ? 'right' : 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(content, Math.round(x), Math.round(y));
        }

        function drawSprite(tex, name, x, y) {
          const canvas = tex.canvas;
          const cut = name ? tex.frames[name] : {x: 0, y: 0, w: canvas.width, h: canvas.height};
          ctx.drawImage(
            canvas, cut.x, cut.y, cut.w, cut.h,
            Math.round(x - cut.w / 2), Math.round(y - cut.h / 2), cut.w, cut.h
          );
        }

        function drawBevel(x, y, w, h, fill, light, dark, thickness = 3) {
          fillRect(x, y, w, h, fill);
          fillRect(x, y, w, thickness, light);
          fillRect(x, y, thickness, h, light);
          fillRect(x, y + h - thickness, w, thickness, dark);
          fillRect(x + w - thickness, y, thickness, h, dark);
        }

        function drawMeter(x, y, width, height, pct, fill, border) {
          const barWidth = Math.max(8, Math.round(width));
          const barHeight = Math.max(4, Math.round(height));
          const clamped = clamp(pct || 0, 0, 1);
          const segment = Math.max(3, Math.round(barHeight * 0.7));
          const inner = barWidth - 4;
          const cells = Math.max(1, Math.floor(inner / segment));
          const lit = Math.round(cells * clamped);
          const cellWidth = inner / cells;

          fillRect(x, y, barWidth, barHeight, PALETTE.shadow);
          ctx.fillStyle = fill;
          for (let i = 0; i < lit; i++) {
            ctx.fillRect(
              x + Math.round(2 + i * cellWidth), y + 2,
              Math.round(Math.max(1, cellWidth - 1)), barHeight - 4
            );
          }
          strokeRect(x + 1, y + 1, barWidth - 2, barHeight - 2, border, 2);
        }

        function layoutColumn(top, bottom, heights, gap = Math.round(F * 0.5)) {
          const total = heights.reduce((sum, h) => sum + h, 0) + Math.max(0, heights.length - 1) * gap;
          let y = top + Math.max(0, (bottom - top - total) / 2);
          return heights.map((height) => {
            const centre = Math.round(y + height / 2);
            y += height + gap;
            return centre;
          });
        }

        class Widget {
          constructor(x, y, w, h, onClick) {
            this.x = Math.round(x);
            this.y = Math.round(y);
            this.w = Math.round(w);
            this.h = Math.round(h);
            this.onClick = onClick;
            this.enabled = true;
            this.hot = false;
          }

          contains(px, py) {
            return this.enabled
              && px >= this.x && px <= this.x + this.w
              && py >= this.y && py <= this.y + this.h;
          }

          draw() {}
        }

        class Button extends Widget {
          constructor(scene, x, y, content, onClick, options = {}) {
            const width = options.width || BTN_W;
            const height = options.height || BTN_H;
            super(x - width / 2, y - height / 2, width, height, onClick);

            const colors = scene.colors;
            this.centreX = Math.round(x);
            this.centreY = Math.round(y);
            this.size = options.size || F;
            this.idleColor = options.active ? colors.accent
              : options.dim ? PALETTE.muted
                : colors.ui;
            this.hoverColor = options.active ? colors.accent : colors.text;
            this.enabled = options.enabled !== false;
            this.setLabel(content);
          }

          setLabel(content) {
            this.text = content;
            return this;
          }

          draw() {
            const lit = this.hot && this.enabled;
            const color = lit ? this.hoverColor : this.idleColor;
            fillRect(this.x, this.y, this.w, this.h, lit ? PALETTE.slate : PALETTE.ink, lit ? 0.55 : 0.8);
            strokeRect(this.x, this.y, this.w, this.h, color);
            label(this.centreX, this.centreY + 1, this.text, {
              size: this.size, color, maxWidth: this.w - PAD * 2
            });
          }
        }

        let clock = 0;

        const pointer = {x: -1, y: -1, id: 0};

        class Scene {
          constructor(name) {
            this.name = name;
            this.widgets = [];
          }

          get colors() {
            return THEMES[run.themeIndex].colors;
          }

          build() {}

          update() {}

          render() {
            this.clear();
            this.drawWidgets();
          }

          clear() {
            fillRect(0, 0, VIEW_W, VIEW_H, this.colors.bg);
          }

          add(widget) {
            this.widgets.push(widget);
            return widget;
          }

          button(x, y, content, onClick, options) {
            return this.add(new Button(this, x, y, content, onClick, options));
          }

          drawWidgets() {
            for (const widget of this.widgets) widget.draw();
          }

          refreshHover() {
            let hot = false;
            for (const widget of this.widgets) {
              widget.hot = widget.contains(pointer.x, pointer.y);
              hot = hot || widget.hot;
            }
            stage.style.cursor = hot ? 'pointer' : 'default';
          }

          pointerDown() {}

          pointerMove() {
            this.refreshHover();
          }

          pointerUp(x, y) {
            for (const widget of this.widgets) {
              if (widget.contains(x, y)) {
                widget.hot = false;
                widget.onClick();
                return;
              }
            }
          }

          keyDown() {}

          keyUp() {}

          clearInput() {}

          fullscreenChanged() {}

          destroy() {}

          start(name) {
            game.start(name);
          }

          restart() {
            game.start(this.name);
          }
        }

        function freshStats() {
          return {
            speed: 1, mudProof: false, dashDist: 0, dashCd: 3, dashStun: false,
            ghostSlow: 1, surgePlus: 0, curfewPlus: 0, wardenSlow: 1,
            bubble: false, encore: false,
            coinPlus: 0, streakStep: 1, streakKeep: 0, overtimeRate: 2,
            quotaRate: 0.7, bankBonus: 0, bounty: 1, orbPay: 0, gateHeal: 1, lucky: 0
          };
        }

        class RunState {
          constructor() {
            this.highScore = save.best;
            this.themeIndex = clamp(save.theme, 0, THEMES.length - 1);
            this.randomSeed = true;
            this.seedText = '';
            this.seed = '';
            this.rng = Math.random;
            this.reset();
          }

          reset() {
            this.floor = 1;
            this.bank = 0;
            this.carry = 0;
            this.lostCarry = 0;
            this.streak = 0;
            this.bestStreak = 0;
            this.health = 5;
            this.maxHealth = 5;
            this.stats = freshStats();
            this.cards = [];
            this.activeItem = null;
            this.startTime = 0;
            this.finalTime = '0:00';
          }

          get score() {
            return this.bank + this.carry;
          }

          begin() {
            this.reset();
            this.seed = this.randomSeed
              ? Math.random().toString(36).slice(2, 8)
              : (this.seedText || 'maze');
            this.rng = seededRandom(this.seed);
            this.startTime = Date.now();
          }

          // Generation must not ride the gameplay stream: ghost decisions and
          // lucky rolls consume run.rng, so a shared stream would make every
          // floor past the first depend on how the previous ones were played.
          floorRng(tag) {
            return seededRandom(`${this.seed}/${tag}/${this.floor}`);
          }

          bankFloor() {
            const gain = this.stats.bankBonus > 0
              ? Math.floor(this.carry * (1 + this.stats.bankBonus))
              : this.carry;
            this.bank += gain;
            this.carry = 0;
            this.health = Math.min(this.maxHealth, this.health + this.stats.gateHeal);
            this.floor++;
          }

          draftChoices() {
            const owned = new Set(this.cards);
            const pool = Object.keys(CARDS).filter((key) => (
              CARDS[key].type === 'active' ? this.activeItem !== key : !owned.has(key)
            ));

            const weight = (key) => {
              const rarity = CARDS[key].rarity;
              if (rarity === 'epic') return 8 + Math.min(12, this.floor);
              if (rarity === 'rare') return 26;
              return 52;
            };

            const rng = this.floorRng('draft');
            const picks = [];
            while (picks.length < 3 && pool.length > 0) {
              let total = 0;
              for (const key of pool) total += weight(key);
              let roll = rng() * total;
              let index = pool.length - 1;
              for (let i = 0; i < pool.length; i++) {
                roll -= weight(pool[i]);
                if (roll <= 0) { index = i; break; }
              }
              picks.push(pool.splice(index, 1)[0]);
            }
            return picks;
          }

          takeCard(key) {
            const card = CARDS[key];
            if (!card) return;
            if (card.type === 'active') this.activeItem = key;
            else card.apply(this);
            this.cards.push(key);
          }

          finish() {
            this.lostCarry = this.carry;
            this.carry = 0;
            if (this.bank > this.highScore) {
              this.highScore = this.bank;
              save.best = this.bank;
            }
            const elapsed = Date.now() - this.startTime;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            this.finalTime = `${minutes}:${String(seconds).padStart(2, '0')}`;
          }
        }

        const run = new RunState();

        function summary() {
          return `KuruKuru Chase!!\nscore: ${run.bank}\nfloor: ${run.floor}\ntime: ${run.finalTime}\nseed: ${run.seed}`;
        }

        async function shareResults() {
          const report = summary();
          try {
            await navigator.clipboard.writeText(report);
            return true;
          } catch {
            window.alert(report);
            return false;
          }
        }

        const CARD_IMAGE_W = 600;
        const CARD_IMAGE_H = 400;

        function downloadResults(colors) {
          const canvas = document.createElement('canvas');
          canvas.width = CARD_IMAGE_W;
          canvas.height = CARD_IMAGE_H;

          const target = canvas.getContext('2d');
          target.imageSmoothingEnabled = false;
          target.fillStyle = colors.bg;
          target.fillRect(0, 0, CARD_IMAGE_W, CARD_IMAGE_H);
          target.strokeStyle = colors.ui;
          target.lineWidth = 5;
          target.strokeRect(0, 0, CARD_IMAGE_W, CARD_IMAGE_H);
          target.textAlign = 'center';

          target.font = `22px ${FONT}`;
          target.fillStyle = colors.accent;
          target.fillText('KuruKuru Chase!!', CARD_IMAGE_W / 2, 60);

          target.font = `16px ${FONT}`;
          const lines = [
            [`score: ${run.bank}`, colors.ui, 130],
            [`floor: ${run.floor}`, colors.pellet, 180],
            [`time: ${run.finalTime}`, colors.accent, 230],
            [`best streak: ${run.bestStreak}`, colors.text, 280]
          ];
          for (const [text, color, y] of lines) {
            target.fillStyle = color;
            target.fillText(text, CARD_IMAGE_W / 2, y);
          }

          target.font = `11px ${FONT}`;
          target.fillStyle = PALETTE.dim;
          target.fillText(`seed: ${run.seed}`, CARD_IMAGE_W / 2, 350);

          const link = document.createElement('a');
          link.download = `kurukuru-chase-${Date.now()}.jpg`;
          link.href = canvas.toDataURL('image/jpeg');
          link.click();
        }

        function isTouchDevice() {
          return typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
        }

        const BASE_SPEED = 4.5;
        const DASH_INVULN = 0.5;
        const HIT_INVULN = 1.5;
        const DASH_STUN_RADIUS_SQ = 0.64;

        class Player {
          constructor(scene, tileX, tileY) {
            this.gs = scene;
            this.tx = tileX;
            this.ty = tileY;
            this.dirX = 0;
            this.dirY = 0;

            this.surgeTimer = 0;
            this.invulnTimer = 0;
            this.dashCooldown = 0;
            this.activeCooldown = 0;
            this.intangible = 0;
            this.anchor = null;

            this.facing = PAC_DIRS[0];
            this.animTime = 0;
            this.alpha = 1;
            this.syncPosition();
          }

          get stats() {
            return run.stats;
          }

          syncPosition() {
            this.x = this.tx * TILE + TILE / 2;
            this.y = this.ty * TILE + TILE / 2;
          }

          walkable(x, y) {
            if (x < 0 || x >= MAZE_W || y < 0 || y >= MAZE_H) return false;
            return this.gs.maze[y][x] !== WALL || this.intangible > 0;
          }

          burrow(seconds) {
            this.intangible = seconds;
          }

          dash() {
            if (this.dashCooldown > 0) return;

            if (this.dirX === 0 && this.dirY === 0) {
              const want = this.gs.desiredDir();
              if (!want) return;
              this.dirX = want.x;
              this.dirY = want.y;
            }

            this.dashCooldown = this.stats.dashCd;
            this.invulnTimer = DASH_INVULN;
            audio.dash();

            const steps = 3 + this.stats.dashDist;
            for (let i = 0; i < steps; i++) {
              const nx = this.tx + this.dirX;
              const ny = this.ty + this.dirY;
              const inside = nx > 0 && nx < MAZE_W - 1 && ny > 0 && ny < MAZE_H - 1;
              if (!inside || !this.walkable(Math.round(nx), Math.round(ny))) break;

              this.tx = nx;
              this.ty = ny;
              if (this.stats.dashStun) this.gs.stunGhostsNear(nx, ny, DASH_STUN_RADIUS_SQ);
              this.gs.burst(nx * TILE + TILE / 2, ny * TILE + TILE / 2, 1, PALETTE.rose);
            }
            this.syncPosition();
          }

          hurt() {
            this.invulnTimer = HIT_INVULN;
          }

          update(dt) {
            if (this.dashCooldown > 0) this.dashCooldown -= dt;
            if (this.activeCooldown > 0) this.activeCooldown -= dt;
            if (this.surgeTimer > 0) this.surgeTimer -= dt;
            if (this.invulnTimer > 0) this.invulnTimer -= dt;
            if (this.intangible > 0) this.intangible -= dt;

            const tile = this.gs.tileAt(Math.round(this.tx), Math.round(this.ty));
            this.step(BASE_SPEED * this.stats.speed * this.gs.terrainFactor(tile) * dt);
            this.syncPosition();
            this.updateVisuals(dt);
          }

          step(distance) {
            let want = this.gs.desiredDir();

            if (want) {
              if (want.x === this.dirX && want.y === this.dirY) {
                this.gs.clearBuffer();
                want = null;
              } else if (this.dirX === 0 && this.dirY === 0) {
                const cx = Math.round(this.tx);
                const cy = Math.round(this.ty);
                if (this.walkable(cx + want.x, cy + want.y)) {
                  this.tx = cx;
                  this.ty = cy;
                  this.dirX = want.x;
                  this.dirY = want.y;
                  this.gs.clearBuffer();
                  want = null;
                }
              } else if (want.x === -this.dirX && want.y === -this.dirY) {
                this.dirX = want.x;
                this.dirY = want.y;
                this.gs.clearBuffer();
                want = null;
              }
            }

            let remaining = distance;

            if (want && (this.dirX !== 0 || this.dirY !== 0)) {
              const cx = Math.round(this.tx);
              const cy = Math.round(this.ty);
              const toCentre = this.dirX !== 0 ? (cx - this.tx) * this.dirX : (cy - this.ty) * this.dirY;
              if (toCentre <= remaining && toCentre >= -TURN_SLACK && this.walkable(cx + want.x, cy + want.y)) {
                this.tx = cx;
                this.ty = cy;
                remaining -= Math.max(0, toCentre);
                this.dirX = want.x;
                this.dirY = want.y;
                this.gs.clearBuffer();
              }
            }

            if (this.dirX === 0 && this.dirY === 0) return;

            const cx = Math.round(this.tx);
            const cy = Math.round(this.ty);
            const nx = this.tx + this.dirX * remaining;
            const ny = this.ty + this.dirY * remaining;

            if (this.walkable(cx + this.dirX, cy + this.dirY)) {
              this.tx = nx;
              this.ty = ny;
            } else {
              if (this.dirX > 0) this.tx = Math.min(nx, cx);
              else if (this.dirX < 0) this.tx = Math.max(nx, cx);
              if (this.dirY > 0) this.ty = Math.min(ny, cy);
              else if (this.dirY < 0) this.ty = Math.max(ny, cy);
            }

            this.tx = clamp(this.tx, 0, MAZE_W - 1);
            this.ty = clamp(this.ty, 0, MAZE_H - 1);
          }

          updateVisuals(dt) {
            const moving = this.dirX !== 0 || this.dirY !== 0;
            if (moving) {
              this.facing = this.dirY !== 0
                ? (this.dirY > 0 ? 'down' : 'up')
                : (this.dirX > 0 ? 'right' : 'left');
              this.animTime += dt;
            } else {
              this.facing = PAC_DIRS[0];
              this.animTime = 0;
            }

            let alpha = 1;
            if (this.intangible > 0) alpha = 0.3;
            else if (this.invulnTimer > 0 && Math.floor(clock / 100) % 2) alpha = 0.5;
            this.alpha = alpha;
          }

          get frameName() {
            const cycle = PAC_STEPS * 2 - 2;
            const tick = Math.floor(this.animTime * CHOMP_FPS) % cycle;
            const step = tick < PAC_STEPS ? tick : cycle - tick;
            return `${this.facing}-${step}`;
          }
        }

        const STILL = {x: 0, y: 0};
        const openScratch = [];

        function openDirs(maze, cx, cy, back) {
          openScratch.length = 0;
          for (const dir of DIRS) {
            const nx = cx + dir.x;
            const ny = cy + dir.y;
            if (nx < 0 || nx >= MAZE_W || ny < 0 || ny >= MAZE_H) continue;
            if (maze[ny][nx] === WALL) continue;
            if (back && dir.x === -back.x && dir.y === -back.y) continue;
            openScratch.push(dir);
          }
          if (openScratch.length === 0 && back) return openDirs(maze, cx, cy, null);
          return openScratch;
        }

        function greedyStep(options, cx, cy, tx, ty) {
          let best = STILL;
          let bestDist = Infinity;
          for (const dir of options) {
            const dx = cx + dir.x - tx;
            const dy = cy + dir.y - ty;
            const dist = dx * dx + dy * dy;
            if (dist < bestDist) { bestDist = dist; best = dir; }
          }
          return best;
        }

        class Walker {
          constructor(scene, tileX, tileY) {
            this.gs = scene;
            this.tx = tileX;
            this.ty = tileY;
            this.dir = {x: 0, y: 0};
            this.nextTile = {x: Math.round(tileX), y: Math.round(tileY)};
            this.syncPosition();
          }

          syncPosition() {
            this.x = this.tx * TILE + TILE / 2;
            this.y = this.ty * TILE + TILE / 2;
          }

          advance(distance) {
            const offX = this.tx - this.nextTile.x;
            const offY = this.ty - this.nextTile.y;
            if (offX * offX + offY * offY > 2.25) {
              this.nextTile.x = Math.round(this.tx);
              this.nextTile.y = Math.round(this.ty);
            }

            const dx = this.nextTile.x - this.tx;
            const dy = this.nextTile.y - this.ty;
            const toNext = Math.sqrt(dx * dx + dy * dy);

            if (toNext > distance) {
              this.tx += (dx / toNext) * distance;
              this.ty += (dy / toNext) * distance;
            } else {
              this.tx = this.nextTile.x;
              this.ty = this.nextTile.y;
              const remaining = distance - toNext;
              this.decideNext();
              if (this.dir.x !== 0 || this.dir.y !== 0) {
                this.tx += this.dir.x * remaining;
                this.ty += this.dir.y * remaining;
              }
            }

            this.syncPosition();
          }

          decideNext() {}
        }

        const TYPE_SPEEDS = [1.05, 1.0, 0.95, 0.9];
        const SPEED_SCALE = 4.0;
        const SPEED_CAP = 7.0;
        const RESPAWN_SECONDS = 5;
        const CYCLE_SECONDS = 12;
        const SCATTER_SECONDS = 5;
        const BLINK_MS = 200;
        const AMBUSH_LEAD = 4;
        const SHY_RANGE_SQ = 64;
        const PATHFIND_CHANCE = 0.3;

        const SCATTER_CORNERS = [
          {x: MAZE_W - 2, y: 1},
          {x: 1, y: 1},
          {x: MAZE_W - 2, y: MAZE_H - 2},
          {x: 1, y: MAZE_H - 2}
        ];

        class Ghost extends Walker {
          constructor(scene, tileX, tileY, index, floor) {
            super(scene, tileX, tileY);
            this.type = index % 4;
            this.homeX = tileX;
            this.homeY = tileY;
            this.baseSpeed = TYPE_SPEEDS[this.type] * (1 + floor * 0.02);
            this.mode = 'scatter';
            this.scaredTimer = 0;
            this.dead = false;
            this.respawnTimer = 0;
            this.stun = 0;
          }

          get frightened() {
            return this.mode === 'frightened';
          }

          update(dt) {
            if (this.dead) {
              this.respawnTimer -= dt;
              if (this.respawnTimer <= 0) {
                this.dead = false;
                this.tx = this.homeX;
                this.ty = this.homeY;
                this.nextTile = {x: Math.round(this.tx), y: Math.round(this.ty)};
                this.syncPosition();
              }
              return;
            }

            if (this.stun > 0) {
              this.stun -= dt;
              return;
            }

            if (this.scaredTimer > 0) {
              this.scaredTimer -= dt;
              this.mode = 'frightened';
            } else {
              this.mode = this.gs.gameTime % CYCLE_SECONDS < SCATTER_SECONDS ? 'scatter' : 'chase';
            }

            this.advance(this.currentSpeed() * dt);
          }

          currentSpeed() {
            let speed = this.baseSpeed * SPEED_SCALE * run.stats.ghostSlow;

            if (this.frightened) speed *= 0.6;
            else if (this.gs.gate.open) speed *= 1.15;

            if (this.type === 0 && this.mode === 'chase' && this.gs.totalCoins > 0
              && this.gs.coinsTaken / this.gs.totalCoins > 0.7) {
              speed *= 1.1;
            }

            const tile = this.gs.tileAt(Math.round(this.tx), Math.round(this.ty));
            if (tile === FAST) speed *= 1.2;
            if (tile === MUD) speed *= 0.8;

            return Math.min(speed, SPEED_CAP);
          }

          decideNext() {
            const maze = this.gs.maze;
            const rng = run.rng;
            const player = this.gs.player;
            const cx = Math.round(this.tx);
            const cy = Math.round(this.ty);

            const bait = this.gs.bait;
            const blind = this.gs.veilTimer > 0 && !bait;

            let tx = player.tx;
            let ty = player.ty;
            if (bait) {
              tx = bait.tileX;
              ty = bait.tileY;
            }

            if (this.frightened || blind) {
              tx = Math.floor(rng() * MAZE_W);
              ty = Math.floor(rng() * MAZE_H);
            } else if (this.mode === 'scatter' && !bait) {
              const corner = SCATTER_CORNERS[this.type];
              tx = corner.x;
              ty = corner.y;
            } else if (!bait) {
              if (this.type === 1) {
                tx += player.dirX * AMBUSH_LEAD;
                ty += player.dirY * AMBUSH_LEAD;
              } else if (this.type === 3) {
                const dx = cx - tx;
                const dy = cy - ty;
                if (dx * dx + dy * dy < SHY_RANGE_SQ) {
                  tx = SCATTER_CORNERS[3].x;
                  ty = SCATTER_CORNERS[3].y;
                }
              }
            }

            const options = openDirs(maze, cx, cy, this.dir);

            if (this.frightened || blind) {
              this.dir = options[Math.floor(rng() * options.length)] || {x: 0, y: 0};
            } else if (this.type === 0 && rng() < PATHFIND_CHANCE) {
              const route = findPath(cx, cy, Math.round(tx), Math.round(ty), maze);
              this.dir = route && route.length > 0
                ? {x: route[0].x - cx, y: route[0].y - cy}
                : greedyStep(options, cx, cy, tx, ty);
            } else {
              this.dir = greedyStep(options, cx, cy, tx, ty);
            }

            this.nextTile = {x: cx + this.dir.x, y: cy + this.dir.y};
          }

          get frameName() {
            if (this.frightened) {
              return `fright-${Math.floor(clock / BLINK_MS) % 2 === 0 ? 1 : 0}`;
            }
            const eye = (this.dir.y > 0 ? 2 : 0) + (this.dir.x > 0 ? 1 : 0);
            return `t${this.type}-${eye}`;
          }

          catchIt() {
            this.dead = true;
            this.respawnTimer = RESPAWN_SECONDS;
          }
        }

        const WARDEN_START_SPEED = 3.2;
        const WARDEN_TOP_SPEED = 6;
        const WARDEN_RAMP = 0.03;
        const WARDEN_FLICKER_MS = 120;

        const WARDEN_CORNERS = [
          {x: 1, y: 1},
          {x: MAZE_W - 2, y: 1},
          {x: 1, y: MAZE_H - 2},
          {x: MAZE_W - 2, y: MAZE_H - 2}
        ];

        class Warden extends Walker {
          constructor(scene, tileX, tileY) {
            super(scene, tileX, tileY);
            this.speed = WARDEN_START_SPEED;
          }

          static spawnFurthestFrom(scene, player) {
            let best = WARDEN_CORNERS[0];
            let bestDist = -1;
            for (const corner of WARDEN_CORNERS) {
              const dist = Math.hypot(corner.x - player.tx, corner.y - player.ty);
              if (dist > bestDist) { bestDist = dist; best = corner; }
            }
            return new Warden(scene, best.x, best.y);
          }

          update(dt) {
            this.speed = Math.min(WARDEN_TOP_SPEED, this.speed + dt * WARDEN_RAMP);
            this.advance(this.speed * run.stats.wardenSlow * dt);
          }

          decideNext() {
            const cx = Math.round(this.tx);
            const cy = Math.round(this.ty);
            const player = this.gs.player;
            const route = findPath(cx, cy, Math.round(player.tx), Math.round(player.ty), this.gs.maze);

            this.dir = route && route.length > 0
              ? {x: route[0].x - cx, y: route[0].y - cy}
              : greedyStep(openDirs(this.gs.maze, cx, cy, null), cx, cy, player.tx, player.ty);

            this.nextTile = {x: cx + this.dir.x, y: cy + this.dir.y};
          }

          get frameName() {
            return `f${Math.floor(clock / WARDEN_FLICKER_MS) % 2}`;
          }
        }

        const KEY_PAD = 92;
        const KEY_BTN = 120;
        const PAD_X = PAD;
        const PAD_Y = VIEW_H - PAD - KEY_PAD * 3;
        const ARC_X = KEY_BTN + Math.round(PAD * 0.5);
        const ARC_Y = Math.round(KEY_BTN * 0.62);
        const OVERLAY_ALPHA = 0.62;

        const ZONES = {
          up: {x: PAD_X + KEY_PAD, y: PAD_Y, w: KEY_PAD, h: KEY_PAD},
          left: {x: PAD_X, y: PAD_Y + KEY_PAD, w: KEY_PAD, h: KEY_PAD},
          mid: {x: PAD_X + KEY_PAD, y: PAD_Y + KEY_PAD, w: KEY_PAD, h: KEY_PAD},
          right: {x: PAD_X + KEY_PAD * 2, y: PAD_Y + KEY_PAD, w: KEY_PAD, h: KEY_PAD},
          down: {x: PAD_X + KEY_PAD, y: PAD_Y + KEY_PAD * 2, w: KEY_PAD, h: KEY_PAD},
          dash: {x: VIEW_W - PAD - KEY_BTN, y: VIEW_H - PAD - KEY_BTN, w: KEY_BTN, h: KEY_BTN},
          item: {x: VIEW_W - PAD - KEY_BTN - ARC_X, y: VIEW_H - PAD - KEY_BTN - ARC_Y, w: KEY_BTN, h: KEY_BTN}
        };

        const DIR_KEYS = ['up', 'down', 'left', 'right'];

        function insideZone(zone, x, y) {
          return x >= zone.x && x <= zone.x + zone.w && y >= zone.y && y <= zone.y + zone.h;
        }

        class TouchControls {
          constructor(scene) {
            this.scene = scene;
            this.held = null;
            this.pointers = new Map();
            this.swipeFrom = null;
            this.dashReady = true;
            this.itemReady = true;
          }

          dirAt(x, y) {
            for (const key of DIR_KEYS) {
              if (insideZone(ZONES[key], x, y)) return key;
            }
            return null;
          }

          down(id, x, y) {
            const dir = this.dirAt(x, y);
            if (dir) {
              this.pointers.set(id, 'pad');
              this.setHeld(dir);
              return;
            }
            if (insideZone(ZONES.dash, x, y)) {
              this.pointers.set(id, 'action');
              this.scene.player.dash();
              return;
            }
            if (insideZone(ZONES.item, x, y)) {
              this.pointers.set(id, 'action');
              this.scene.useActive();
              return;
            }
            this.pointers.set(id, 'swipe');
            this.swipeFrom = {x, y, done: false};
          }

          move(id, x, y) {
            const role = this.pointers.get(id);
            if (role === 'pad') {
              const dir = this.dirAt(x, y);
              if (dir && dir !== this.held) this.setHeld(dir);
              return;
            }
            if (role !== 'swipe' || !this.swipeFrom || this.swipeFrom.done) return;

            const dx = x - this.swipeFrom.x;
            const dy = y - this.swipeFrom.y;
            if (Math.abs(dx) > 40 || Math.abs(dy) > 40) {
              this.swipeFrom.done = true;
              this.scene.queueDir(
                Math.abs(dx) > Math.abs(dy)
                  ? (dx > 0 ? 'right' : 'left')
                  : (dy > 0 ? 'down' : 'up')
              );
            }
          }

          up(id) {
            if (this.pointers.get(id) === 'pad') this.setHeld(null);
            this.pointers.delete(id);
          }

          setHeld(dir) {
            this.held = dir;
            if (dir) this.scene.queueDir(dir);
          }

          update() {
            this.dashReady = this.scene.player.dashCooldown <= 0;
            this.itemReady = !!run.activeItem && this.scene.player.activeCooldown <= 0;
          }

          draw() {
            const colors = this.scene.colors;
            ctx.globalAlpha = OVERLAY_ALPHA;

            for (const key of [...DIR_KEYS, 'mid']) {
              const zone = ZONES[key];
              ctx.globalAlpha = key === this.held ? OVERLAY_ALPHA * 0.7 : OVERLAY_ALPHA;
              drawBevel(zone.x, zone.y, zone.w, zone.h, PALETTE.shadow, PALETTE.slate, PALETTE.ink);
            }

            ctx.globalAlpha = OVERLAY_ALPHA;
            ctx.fillStyle = colors.accent;
            for (const key of DIR_KEYS) {
              const zone = ZONES[key];
              const cx = zone.x + zone.w / 2;
              const cy = zone.y + zone.h / 2;
              const unit = Math.max(2, Math.round(zone.w / 11));
              const dx = key === 'left' ? -1 : key === 'right' ? 1 : 0;
              const dy = key === 'up' ? -1 : key === 'down' ? 1 : 0;
              for (let i = 0; i < 3; i++) {
                const len = (3 - i) * 2;
                if (dy) ctx.fillRect(cx - len * unit / 2, cy + dy * (i - 1) * unit, len * unit, unit);
                else ctx.fillRect(cx + dx * (i - 1) * unit, cy - len * unit / 2, unit, len * unit);
              }
            }

            const midDot = Math.max(3, Math.round(ZONES.mid.w * 0.16));
            ctx.fillStyle = PALETTE.ink;
            ctx.fillRect(
              ZONES.mid.x + ZONES.mid.w / 2 - midDot, ZONES.mid.y + ZONES.mid.h / 2 - midDot,
              midDot * 2, midDot * 2
            );

            this.drawAction(ZONES.dash, 'dash', this.dashReady ? colors.accent : PALETTE.muted);
            this.drawAction(ZONES.item, 'item', this.itemReady ? PALETTE.rose : PALETTE.muted);

            ctx.globalAlpha = 1;
          }

          drawAction(zone, text, color) {
            fillRect(zone.x, zone.y, zone.w, zone.h, PALETTE.ink, 0.8);
            strokeRect(zone.x, zone.y, zone.w, zone.h, color, 3);
            label(zone.x + zone.w / 2, zone.y + zone.h / 2, text, {
              size: Math.round(zone.w * 0.28), color, maxWidth: zone.w - 8
            });
          }
        }

        const BAR_W = 156;
        const BAR_H = 12;
        const SPEAKER_UNIT = 6;
        const SPEAKER_W = SPEAKER_UNIT * 8;

        class SpeakerButton extends Widget {
          constructor(scene) {
            const hitPad = Math.round(F * 0.5);
            const x = VIEW_W - PAD - SPEAKER_W;
            const y = Math.round(HUD_H / 2 - SPEAKER_UNIT * 3);
            super(x - hitPad, y - hitPad, SPEAKER_W + hitPad * 2, SPEAKER_UNIT * 6 + hitPad * 2, () => audio.toggle());
            this.scene = scene;
            this.iconX = x;
            this.iconY = y;
          }

          draw() {
            const s = SPEAKER_UNIT;
            const x = this.iconX;
            const y = this.iconY;
            ctx.fillStyle = this.scene.colors.accent;
            ctx.fillRect(x + s, y + s * 2, s, s * 2);
            ctx.fillRect(x + s * 2, y + s, s, s * 4);
            ctx.fillRect(x + s * 3, y, s, s * 6);

            if (audio.enabled) {
              ctx.fillRect(x + s * 5, y + s * 2, s, s * 2);
              ctx.fillRect(x + s * 6, y + s, s, s * 4);
            } else {
              ctx.fillRect(x + s * 5, y + s * 2, s, s);
              ctx.fillRect(x + s * 5, y + s * 3, s, s);
              ctx.fillRect(x + s * 6, y + s, s, s);
              ctx.fillRect(x + s * 6, y + s * 3, s, s);
            }
          }
        }

        const CAMERA_LERP = 0.1;
        const PICKUP_RANGE = 0.5;
        const CATCH_RANGE_SQ = 0.36;
        const MAGNET_RANGE_SQ = 64;
        const MAGNET_SPEED = 10;
        const BANNER_MS = 1400;
        const ORB_PULSE_MS = 250;
        const GATE_PULSE_MS = 250;
        const ANCHOR_BLINK_MS = 300;
        const SURGE_BLINK_MS = 120;
        const BASE_CURFEW = 92;
        const MIN_CURFEW = 50;
        const CHAIN_CAP = 800;
        const PARTICLE_LIFE = 0.5;
        const POPUP_LIFE = 0.9;

        class GameScene extends Scene {
          constructor() {
            super('Game');
          }

          build() {
            this.gameTime = 0;
            this.paused = false;
            this.finished = false;
            this.timeStop = 0;
            this.veilTimer = 0;
            this.magnetPulse = 0;
            this.chain = 0;
            this.bait = null;
            this.warden = null;
            this.heldDirs = [];
            this.dirBuffer = null;
            this.sparks = [];
            this.popups = [];
            this.shakeLeft = 0;
            this.shakeIntensity = 0;
            this.bannerStart = clock;

            const floor = generateFloor(run.floor, run.floorRng('floor'), run.stats.quotaRate);
            this.maze = floor.maze;
            this.gate = floor.gate;
            this.totalCoins = floor.totalCoins;
            this.quota = floor.quota;
            this.coinsTaken = 0;
            this.curfew = Math.max(MIN_CURFEW, BASE_CURFEW - run.floor * 2) + run.stats.curfewPlus;
            this.bubbleUp = run.stats.bubble;

            this.buildWorld(floor);

            this.speaker = this.add(new SpeakerButton(this));
            this.touch = isTouchDevice() ? new TouchControls(this) : null;

            audio.setMood('full');
          }

          buildWorld(floor) {
            this.area = {
              x: 0,
              y: HUD_H + PAD,
              w: VIEW_W,
              h: VIEW_H - HUD_H - PAD * 2
            };

            const mapW = MAZE_W * TILE;
            const mapH = MAZE_H * TILE;

            this.zoom = clamp(
              Math.floor(Math.min(this.area.w / mapW, this.area.h * 1.03 / mapH)), 1, 4
            );
            this.mapW = mapW * this.zoom;
            this.mapH = mapH * this.zoom;

            paintMaze(this.maze, this.colors);

            this.coins = floor.coins.map((spot) => ({tileX: spot.x, tileY: spot.y}));
            this.orbs = floor.orbs.map((spot) => ({tileX: spot.x, tileY: spot.y}));

            this.player = new Player(this, floor.start.x, floor.start.y);
            this.ghosts = floor.ghosts.map((spot, i) => new Ghost(this, spot.x, spot.y, i, run.floor));

            this.positionWorld(true);
          }

          pressDir(name) {
            const at = this.heldDirs.indexOf(name);
            if (at >= 0) this.heldDirs.splice(at, 1);
            this.heldDirs.push(name);
            this.queueDir(name);
          }

          releaseDir(name) {
            const at = this.heldDirs.indexOf(name);
            if (at >= 0) this.heldDirs.splice(at, 1);
          }

          queueDir(name) {
            const vector = DIR_VECTORS[name];
            if (!vector) return;
            this.dirBuffer = {x: vector.x, y: vector.y, at: this.gameTime};
          }

          clearInput() {
            this.heldDirs.length = 0;
            this.dirBuffer = null;
            if (this.touch) this.touch.setHeld(null);
          }

          clearBuffer() {
            this.dirBuffer = null;
          }

          desiredDir() {
            if (this.dirBuffer) {
              if (this.gameTime - this.dirBuffer.at <= INPUT_BUFFER) return this.dirBuffer;
              this.dirBuffer = null;
            }
            const name = (this.touch && this.touch.held) || this.heldDirs[this.heldDirs.length - 1];
            return name ? DIR_VECTORS[name] : null;
          }

          togglePause() {
            if (this.finished) return;
            this.paused = !this.paused;
            audio.setMood(this.paused ? 'calm' : 'full');
            if (this.paused) this.clearInput();
          }

          keyDown(event) {
            if (event.repeat) return;

            const dir = KEY_DIRS[event.code];
            if (dir) {
              this.pressDir(dir);
              return;
            }
            if (event.code === 'Space') {
              if (!this.paused) this.player.dash();
            } else if (event.code === 'KeyE') {
              if (!this.paused) this.useActive();
            } else if (event.code === 'KeyP' || event.code === 'Escape') {
              this.togglePause();
            }
          }

          keyUp(event) {
            const dir = KEY_DIRS[event.code];
            if (dir) this.releaseDir(dir);
          }

          pointerDown(x, y) {
            if (this.touch && !this.speaker.contains(x, y)) this.touch.down(pointer.id, x, y);
          }

          pointerMove(x, y) {
            this.refreshHover();
            if (this.touch) this.touch.move(pointer.id, x, y);
          }

          pointerUp(x, y) {
            super.pointerUp(x, y);
            if (this.touch) this.touch.up(pointer.id);
          }

          tileAt(x, y) {
            if (y < 0 || y >= MAZE_H || x < 0 || x >= MAZE_W) return WALL;
            return this.maze[y][x];
          }

          terrainFactor(tile) {
            if (tile === FAST) return 1.2;
            if (tile === MUD && !run.stats.mudProof) return 0.8;
            return 1;
          }

          burst(x, y, count, color) {
            for (let i = 0; i < count; i++) {
              const angle = Math.random() * Math.PI * 2;
              const speed = 20 + Math.random() * 130;
              this.sparks.push({
                x, y, color,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: PARTICLE_LIFE
              });
            }
          }

          shake(duration, intensity) {
            this.shakeIntensity = this.shakeLeft > 0
              ? Math.max(this.shakeIntensity, intensity)
              : intensity;
            this.shakeLeft = Math.max(this.shakeLeft, duration / 1000);
          }

          popup(text, tileX, tileY, color) {
            this.popups.push({
              text, color,
              x: tileX * TILE + TILE / 2,
              y: tileY * TILE,
              life: POPUP_LIFE
            });
          }

          stunGhostsNear(tileX, tileY, rangeSq) {
            for (const ghost of this.ghosts) {
              if (ghost.dead) continue;
              const dx = ghost.tx - tileX;
              const dy = ghost.ty - tileY;
              if (dx * dx + dy * dy < rangeSq) ghost.stun = Math.max(ghost.stun, 2);
            }
          }

          startSurge(duration) {
            this.player.surgeTimer = duration;
            this.chain = 0;
            for (const ghost of this.ghosts) ghost.scaredTimer = duration;
          }

          quake() {
            for (const ghost of this.ghosts) {
              if (!ghost.dead) ghost.stun = Math.max(ghost.stun, 3);
            }
            this.shake(400, 0.01);
          }

          spawnBait() {
            this.bait = {tileX: this.player.tx, tileY: this.player.ty, life: 6};
          }

          useAnchor() {
            const player = this.player;
            if (!player.anchor) {
              player.anchor = {x: player.tx, y: player.ty};
              return false;
            }

            player.tx = player.anchor.x;
            player.ty = player.anchor.y;
            player.dirX = 0;
            player.dirY = 0;
            player.syncPosition();
            this.clearBuffer();
            this.burst(player.x, player.y, 8, PALETTE.cyan);
            player.anchor = null;
            return true;
          }

          useActive() {
            const player = this.player;
            if (!run.activeItem || player.activeCooldown > 0) return;

            const card = CARDS[run.activeItem];
            if (!card) return;

            const skipCooldown = card.onUse(this) === false;
            audio.skill();
            if (!skipCooldown) player.activeCooldown = card.cd;
          }

          collectCoin(index) {
            const coin = this.coins[index];
            this.coins.splice(index, 1);
            this.coinsTaken++;

            const stats = run.stats;
            let pay = 10 + stats.coinPlus;
            if (this.gate.open) pay *= stats.overtimeRate;
            pay = Math.floor(pay * (1 + run.streak * 0.02));

            if (stats.lucky > 0 && run.rng() < stats.lucky) {
              pay *= 5;
              this.popup('5x', coin.tileX, coin.tileY, PALETTE.gold);
            }

            run.carry += pay;
            run.streak += stats.streakStep;
            if (run.streak > run.bestStreak) run.bestStreak = run.streak;
            audio.coin();

            if (!this.gate.open && this.coinsTaken >= this.quota) this.openGate();
          }

          collectOrb(index) {
            const orb = this.orbs[index];
            this.orbs.splice(index, 1);

            const stats = run.stats;
            this.startSurge(7 + stats.surgePlus);
            if (stats.orbPay > 0) {
              run.carry += stats.orbPay;
              this.popup(`+${stats.orbPay}`, orb.tileX, orb.tileY, PALETTE.gold);
            }
            audio.orb();
          }

          openGate() {
            this.gate.open = true;
            this.shake(250, 0.006);
            audio.gate();
            this.burst(this.gate.x * TILE + TILE / 2, this.gate.y * TILE + TILE / 2, 12, this.colors.accent);
          }

          catchGhost(ghost) {
            ghost.catchIt();
            this.chain++;

            const pay = Math.min(CHAIN_CAP, 100 * Math.pow(2, this.chain - 1)) * run.stats.bounty;
            run.carry += pay;
            this.popup(`+${pay}`, ghost.tx, ghost.ty, PALETTE.gold);
