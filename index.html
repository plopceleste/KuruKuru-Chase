            this.shake(300, 0.008);
            audio.catchGhost();
            this.burst(ghost.x, ghost.y, 10, this.colors.ghosts[ghost.type]);
          }

          hurt() {
            if (this.bubbleUp) {
              this.bubbleUp = false;
              this.player.hurt();
              this.shake(300, 0.008);
              audio.hurt();
              return;
            }

            run.health -= 1;
            this.player.hurt();
            this.shake(400, 0.014);
            run.streak = Math.floor(run.streak * run.stats.streakKeep);
            audio.hurt();
            this.burst(this.player.x, this.player.y, 15, PALETTE.danger);

            if (run.health > 0) return;

            if (run.stats.encore) {
              run.stats.encore = false;
              run.health = 1;
              this.player.invulnTimer = 3;
              this.shake(600, 0.02);
              for (const ghost of this.ghosts) ghost.stun = 3;
              return;
            }

            audio.die();
            this.gameOver();
          }

          exitFloor() {
            if (this.finished) return;
            this.finished = true;
            audio.clear();
            run.bankFloor();
            this.start('Upgrade');
          }

          gameOver() {
            if (this.finished) return;
            this.finished = true;
            run.finish();
            this.start('GameOver');
          }

          update(dt) {
            if (this.shakeLeft > 0) this.shakeLeft -= dt;
            this.updateEffects(dt);
            if (this.paused || this.finished) return;

            this.gameTime += dt;

            const player = this.player;

            if (this.timeStop > 0) this.timeStop -= dt;
            if (this.veilTimer > 0) this.veilTimer -= dt;

            if (!this.warden) {
              this.curfew -= dt;
              if (this.curfew <= 0) this.spawnWarden();
            }

            player.update(dt);

            if (this.magnetPulse > 0) {
              this.magnetPulse -= dt;
              this.pullCoins(dt);
            }

            this.checkPickups();
            if (this.finished) return;

            if (this.timeStop <= 0) this.updateGhosts(dt);
            if (this.warden) this.updateWarden(dt);
            if (this.finished) return;

            this.updateBait(dt);
            this.positionWorld(false);

            if (this.touch) this.touch.update();

            audio.setMood(player.surgeTimer > 0 || this.warden ? 'frenzy' : 'full');
          }

          updateEffects(dt) {
            for (let i = this.sparks.length - 1; i >= 0; i--) {
              const spark = this.sparks[i];
              spark.life -= dt;
              if (spark.life <= 0) {
                this.sparks.splice(i, 1);
                continue;
              }
              spark.x += spark.vx * dt;
              spark.y += spark.vy * dt;
            }

            for (let i = this.popups.length - 1; i >= 0; i--) {
              const note = this.popups[i];
              note.life -= dt;
              if (note.life <= 0) this.popups.splice(i, 1);
            }
          }

          pullCoins(dt) {
            const player = this.player;
            for (const coin of this.coins) {
              const dx = player.tx - coin.tileX;
              const dy = player.ty - coin.tileY;
              const distSq = dx * dx + dy * dy;
              if (distSq >= MAGNET_RANGE_SQ || distSq <= 0.0025) continue;
              const dist = Math.sqrt(distSq);
              coin.tileX += (dx / dist) * dt * MAGNET_SPEED;
              coin.tileY += (dy / dist) * dt * MAGNET_SPEED;
            }
          }

          checkPickups() {
            const player = this.player;

            for (let i = this.coins.length - 1; i >= 0; i--) {
              const coin = this.coins[i];
              if (Math.abs(coin.tileX - player.tx) < PICKUP_RANGE && Math.abs(coin.tileY - player.ty) < PICKUP_RANGE) {
                this.collectCoin(i);
              }
            }

            for (let i = this.orbs.length - 1; i >= 0; i--) {
              const orb = this.orbs[i];
              if (Math.abs(orb.tileX - player.tx) < PICKUP_RANGE && Math.abs(orb.tileY - player.ty) < PICKUP_RANGE) {
                this.collectOrb(i);
              }
            }

            if (this.gate.open
              && Math.abs(this.gate.x - player.tx) < 0.6
              && Math.abs(this.gate.y - player.ty) < 0.6) {
              this.exitFloor();
            }
          }

          updateGhosts(dt) {
            const player = this.player;
            for (const ghost of this.ghosts) {
              ghost.update(dt);
              if (ghost.dead) continue;

              const dx = ghost.tx - player.tx;
              const dy = ghost.ty - player.ty;
              if (dx * dx + dy * dy >= CATCH_RANGE_SQ) continue;

              if (player.surgeTimer > 0 && ghost.scaredTimer > 0) this.catchGhost(ghost);
              else if (player.invulnTimer <= 0) this.hurt();
              if (this.finished) return;
            }
          }

          updateWarden(dt) {
            this.warden.update(dt);
            const dx = this.warden.tx - this.player.tx;
            const dy = this.warden.ty - this.player.ty;
            if (this.player.invulnTimer <= 0 && dx * dx + dy * dy < CATCH_RANGE_SQ) this.hurt();
          }

          spawnWarden() {
            this.warden = Warden.spawnFurthestFrom(this, this.player);
            this.shake(600, 0.02);
            audio.warden();
          }

          updateBait(dt) {
            if (!this.bait) return;
            this.bait.life -= dt;
            if (this.bait.life <= 0) this.bait = null;
          }

          positionWorld(snap) {
            const area = this.area;
            const targetX = area.x + (this.mapW < area.w
              ? (area.w - this.mapW) / 2
              : clamp(area.w / 2 - this.player.x * this.zoom, area.w - this.mapW, 0));
            const targetY = area.y + (this.mapH < area.h
              ? (area.h - this.mapH) / 2
              : clamp(area.h / 2 - this.player.y * this.zoom, area.h - this.mapH, 0));

            if (snap) {
              this.worldX = Math.round(targetX);
              this.worldY = Math.round(targetY);
              return;
            }
            this.worldX = Math.round(this.worldX + (targetX - this.worldX) * CAMERA_LERP);
            this.worldY = Math.round(this.worldY + (targetY - this.worldY) * CAMERA_LERP);
          }

          render() {
            this.clear();

            ctx.save();
            if (this.shakeLeft > 0) {
              ctx.translate(
                Math.round((Math.random() * 2 - 1) * this.shakeIntensity * VIEW_W),
                Math.round((Math.random() * 2 - 1) * this.shakeIntensity * VIEW_H)
              );
            }

            this.renderWorld();
            this.renderHud();
            if (this.touch) this.touch.draw();
            this.renderBanner();
            if (this.paused) this.renderPause();

            ctx.restore();
          }

          renderWorld() {
            const colors = this.colors;
            const player = this.player;

            ctx.save();
            ctx.translate(this.worldX, this.worldY);
            ctx.scale(this.zoom, this.zoom);

            ctx.drawImage(TEX.maze.canvas, 0, 0);

            for (const coin of this.coins) {
              drawSprite(TEX.coin, null, coin.tileX * TILE + TILE / 2, coin.tileY * TILE + TILE / 2);
            }

            const bigOrb = Math.floor(clock / ORB_PULSE_MS) % 2 === 1;
            for (const orb of this.orbs) {
              drawSprite(TEX.orb, bigOrb ? 'big' : 'small', orb.tileX * TILE + TILE / 2, orb.tileY * TILE + TILE / 2);
            }

            const gateFrame = this.gate.open
              ? (Math.floor(clock / GATE_PULSE_MS) % 2 ? 'open-1' : 'open-0')
              : 'closed';
            drawSprite(TEX.gate, gateFrame, this.gate.x * TILE + TILE / 2, this.gate.y * TILE + TILE / 2);

            if (player.anchor) {
              drawSprite(
                TEX.anchor, `f${Math.floor(clock / ANCHOR_BLINK_MS) % 2}`,
                player.anchor.x * TILE + TILE / 2, player.anchor.y * TILE + TILE / 2
              );
            }

            if (this.bait) {
              ctx.globalAlpha = 0.5 + 0.3 * (Math.floor(clock / 150) % 2);
              drawSprite(TEX.bait, null, this.bait.tileX * TILE + TILE / 2, this.bait.tileY * TILE + TILE / 2);
              ctx.globalAlpha = 1;
            }

            for (const ghost of this.ghosts) {
              if (ghost.dead) continue;
              drawSprite(TEX.ghost, ghost.frameName, ghost.x, ghost.y);
            }

            if (this.warden) drawSprite(TEX.warden, this.warden.frameName, this.warden.x, this.warden.y);

            const ringSize = TILE + 6;
            if (this.bubbleUp) {
              strokeRect(player.x - ringSize / 2, player.y - ringSize / 2, ringSize, ringSize, colors.ui, 2);
            }

            ctx.globalAlpha = player.alpha;
            drawSprite(TEX.pac, player.frameName, player.x, player.y);
            ctx.globalAlpha = 1;

            if (player.surgeTimer > 0 && Math.floor(clock / SURGE_BLINK_MS) % 2 === 1) {
              strokeRect(player.x - ringSize / 2, player.y - ringSize / 2, ringSize, ringSize, colors.pellet, 2);
            }

            for (const spark of this.sparks) {
              ctx.globalAlpha = clamp(spark.life / PARTICLE_LIFE, 0, 1);
              ctx.fillStyle = spark.color;
              ctx.fillRect(Math.round(spark.x - 1.5), Math.round(spark.y - 1.5), 3, 3);
            }
            ctx.globalAlpha = 1;

            for (const note of this.popups) {
              const progress = 1 - note.life / POPUP_LIFE;
              ctx.globalAlpha = clamp(note.life / POPUP_LIFE, 0, 1);
              label(note.x, note.y - TILE * progress, note.text, {size: 7, color: note.color});
            }
            ctx.globalAlpha = 1;

            ctx.restore();
          }

          renderHud() {
            const colors = this.colors;
            const player = this.player;

            fillRect(0, 0, VIEW_W, HUD_H, colors.bg);
            fillRect(0, HUD_H - 2, VIEW_W, 2, colors.ui);

            label(PAD, HUD_H / 2, `floor ${run.floor}   score ${run.score}`, {
              size: F, color: colors.ui, originX: 0
            });

            const barX = VIEW_W - PAD - SPEAKER_W - Math.round(F * 0.8) - BAR_W;
            const barY = Math.round(HUD_H / 2 - (BAR_H + 2 + BAR_H * 0.6) / 2);

            label(barX - Math.round(F * 0.5), HUD_H / 2, `hp ${Math.ceil(run.health)}/${run.maxHealth}`, {
              size: F, color: colors.ui, originX: 1
            });

            drawMeter(barX, barY, BAR_W, BAR_H, run.health / run.maxHealth, colors.pellet, colors.text);
            drawMeter(
              barX, barY + BAR_H + 2, BAR_W, Math.max(3, Math.round(BAR_H * 0.6)),
              1 - player.dashCooldown / run.stats.dashCd, PALETTE.rose, PALETTE.slate
            );

            this.speaker.draw();

            const bits = [];
            if (!this.gate.open) bits.push(`coins ${this.coinsTaken}/${this.quota}`);
            else bits.push(`gate open  coins x${run.stats.overtimeRate}`);
            if (run.streak > 1) bits.push(`streak ${run.streak}`);
            if (this.warden) bits.push('the warden is loose');
            else bits.push(`curfew ${Math.max(0, Math.ceil(this.curfew))}s`);

            let statusColor = PALETTE.dim;
            if (this.warden) statusColor = Math.floor(clock / 300) % 2 ? PALETTE.danger : PALETTE.dim;
            else if (this.gate.open) statusColor = colors.accent;

            label(VIEW_W / 2, HUD_H + PAD, bits.join('   '), {
              size: Math.round(F * 0.85), color: statusColor
            });

            const card = run.activeItem ? CARDS[run.activeItem] : null;
            if (!card) return;

            const ready = player.activeCooldown <= 0;
            let text = `${card.name}  ${ready ? '[e]' : `${Math.ceil(player.activeCooldown)}s`}`;
            if (run.activeItem === 'anchor' && player.anchor && ready) text = 'warp anchor  [e] jump';

            label(VIEW_W / 2, HUD_H + PAD + Math.round(F * 1.3), text, {
              size: Math.round(F * 0.85), color: ready ? colors.accent : PALETTE.muted
            });
          }

          renderBanner() {
            const elapsed = clock - this.bannerStart;
            if (elapsed >= BANNER_MS) return;
            const fadeStart = BANNER_MS * 0.7;
            const alpha = elapsed < fadeStart ? 1 : 1 - (elapsed - fadeStart) / (BANNER_MS * 0.3);

            ctx.globalAlpha = clamp(alpha, 0, 1);
            label(VIEW_W / 2, HUD_H + VIEW_H * 0.16, `floor ${run.floor}`, {
              size: Math.round(F * 1.8), color: this.colors.text
            });
            ctx.globalAlpha = 1;
          }

          renderPause() {
            fillRect(0, 0, VIEW_W, VIEW_H, PALETTE.ink, 0.72);
            label(VIEW_W / 2, VIEW_H * 0.45, 'paused', {
              size: Math.round(F * 1.6), color: this.colors.text
            });
            label(VIEW_W / 2, VIEW_H * 0.45 + F * 2.6, 'press p to keep going', {
              size: Math.round(F * 0.8), color: PALETTE.dim
            });
          }
        }

        const BOOT_BAR_W = F * 20;

        function nextFrame() {
          return new Promise((resolve) => requestAnimationFrame(() => setTimeout(resolve, 60)));
        }

        class BootScene extends Scene {
          constructor() {
            super('Boot');
          }

          build() {
            const rows = [Math.round(F * 2.1), Math.round(F * 1.2), Math.round(F * 1.25), BTN_H, BTN_H];
            this.rows = layoutColumn(PAD, VIEW_H - PAD, rows);
            this.progress = 0;
            this.status = 'starting';
            this.boot().catch((error) => {
              console.error(error);
              this.status = 'boot failed - tap start';
              this.progress = 1;
              if (game.scene === this) this.showStart();
            });
          }

          async boot() {
            await this.step('loading font', 0.15);

            try {
              if (document.fonts) {
                await Promise.all([
                  document.fonts.load(`16px ${FONT}`),
                  document.fonts.load(`32px ${FONT}`)
                ]);
                await document.fonts.ready;
              }
            } catch {}

            await this.step('building sprites', 0.55);
            buildTextures(this.colors);

            await this.step('warming the tube', 0.85);
            await this.step('tap start to begin', 1);

            if (game.scene === this) this.showStart();
          }

          async step(status, progress) {
            this.status = status;
            this.progress = progress;
            await nextFrame();
          }

          showStart() {
            this.button(VIEW_W / 2, this.rows[3], 'start', () => {
              audio.unlock();
              if (isTouchDevice()) goImmersive();
              this.start('Menu');
            }, {active: true});

            this.crtButton = this.button(VIEW_W / 2, this.rows[4], this.crtLabel(), () => {
              save.crt = !save.crt;
              setCrt(save.crt);
              this.crtButton.setLabel(this.crtLabel());
            }, {dim: !save.crt});
          }

          crtLabel() {
            return `crt: ${save.crt ? 'on' : 'off'}`;
          }

          render() {
            this.clear();
            const colors = this.colors;

            label(VIEW_W / 2, this.rows[0], 'KuruKuru Chase!!', {
              size: F * 2, color: colors.text, maxWidth: VIEW_W - PAD * 2
            });

            drawMeter(
              VIEW_W / 2 - BOOT_BAR_W / 2, this.rows[1] - Math.round(F * 1.1) / 2,
              BOOT_BAR_W, Math.round(F * 1.1), this.progress, colors.accent, colors.ui
            );

            label(VIEW_W / 2, this.rows[2], this.status, {color: PALETTE.dim});

            this.drawWidgets();
          }
        }

        const MAX_SEED_LENGTH = 12;

        let menuSeedFocus = false;

        class MenuScene extends Scene {
          constructor() {
            super('Menu');
          }

          build() {
            audio.setMood('calm');

            const custom = !run.randomSeed;
            const showHint = !isTouchDevice();

            const heights = [
              Math.round(F * 2.1),
              Math.round(F * 1.1),
              BTN_H,
              ...(custom ? [BTN_H] : []),
              BTN_H, BTN_H, BTN_H,
              ...(showHint ? [Math.round(F * 1.1)] : [])
            ];
            const rows = layoutColumn(PAD, VIEW_H - PAD, heights);
            let index = 0;

            this.titleY = rows[index++];
            this.scoreY = rows[index++];

            this.button(VIEW_W / 2, rows[index++], `seed: ${custom ? 'custom' : 'random'}`, () => {
              run.randomSeed = !run.randomSeed;
              menuSeedFocus = !run.randomSeed;
              this.restart();
            });

            this.seedY = custom ? rows[index++] : 0;
            this.custom = custom;

            this.button(VIEW_W / 2, rows[index++], 'start run', () => {
              run.begin();
              this.start('Game');
            }, {active: true});

            this.button(VIEW_W / 2, rows[index++], 'themes', () => this.start('Themes'));
            this.button(VIEW_W / 2, rows[index++], 'options', () => this.start('Options'));

            this.hintY = showHint ? rows[index] : 0;

            if (custom) {
              this.add(new Widget(
                VIEW_W / 2 - BTN_W / 2, this.seedY - BTN_H / 2, BTN_W, BTN_H,
                () => { menuSeedFocus = true; }
              ));
            }
          }

          keyDown(event) {
            if (!this.custom || !menuSeedFocus || event.ctrlKey || event.metaKey) return;

            if (event.key === 'Backspace') {
              run.seedText = run.seedText.slice(0, -1);
            } else if (event.key === 'Enter' || event.key === 'Escape') {
              menuSeedFocus = false;
              return;
            } else if (event.key.length === 1 && run.seedText.length < MAX_SEED_LENGTH) {
              run.seedText += event.key;
            } else {
              return;
            }

            event.preventDefault();
          }

          render() {
            this.clear();
            const colors = this.colors;

            label(VIEW_W / 2, this.titleY, 'KuruKuru Chase!!', {
              size: F * 2, color: colors.text, maxWidth: VIEW_W - PAD * 2
            });

            label(VIEW_W / 2, this.scoreY, `high score ${run.highScore}`, {
              size: Math.round(F * 0.85), color: PALETTE.dim
            });

            if (this.custom) this.renderSeedField();

            this.drawWidgets();

            if (this.hintY) {
              label(VIEW_W / 2, this.hintY, 'space dash    e item    p pause', {
                size: Math.round(F * 0.85), color: PALETTE.muted
              });
            }
          }

          renderSeedField() {
            const colors = this.colors;
            const x = VIEW_W / 2 - BTN_W / 2;
            const y = this.seedY - BTN_H / 2;
            const text = run.seedText || 'type a seed';

            fillRect(x, y, BTN_W, BTN_H, PALETTE.ink);
            strokeRect(x, y, BTN_W, BTN_H, menuSeedFocus ? colors.text : colors.accent);
            label(VIEW_W / 2, this.seedY, text, {
              color: run.seedText ? colors.text : PALETTE.muted,
              maxWidth: BTN_W - PAD * 2
            });

            if (menuSeedFocus && Math.floor(clock / 400) % 2 === 0) {
              const width = measure(text, fitSize(text, F, BTN_W - PAD * 2));
              fillRect(
                VIEW_W / 2 + width / 2 + 6 - Math.max(2, F / 8) / 2, this.seedY - F / 2,
                Math.max(2, F / 8), F, colors.text
              );
            }
          }
        }

        const THEME_COLUMNS = 6;
        const THEME_CARD_H = Math.round(F * 3.4);
        const THEME_GAP = Math.round(F * 0.5);
        const THEME_CARD_W = Math.min(
          Math.round((VIEW_W - PAD * 2 - THEME_GAP * (THEME_COLUMNS - 1)) / THEME_COLUMNS),
          F * 12
        );

        class ThemeCard extends Widget {
          constructor(scene, theme, index, locked, x, y) {
            super(x, y, THEME_CARD_W, THEME_CARD_H, () => scene.choose(index));
            this.scene = scene;
            this.theme = theme;
            this.locked = locked;
            this.selected = index === run.themeIndex;
            this.enabled = !locked;
          }

          draw() {
            const colors = this.scene.colors;
            const border = this.selected ? colors.accent : (this.locked ? PALETTE.slate : colors.ui);

            fillRect(this.x, this.y, this.w, this.h, PALETTE.ink, this.locked ? 0.9 : 1);
            strokeRect(this.x, this.y, this.w, this.h, border);

            label(this.x + this.w / 2, this.y + this.h * 0.32, this.theme.name, {
              size: Math.round(F * 0.9),
              color: this.locked ? PALETTE.muted : this.theme.colors.ui,
              maxWidth: this.w - 8
            });

            label(this.x + this.w / 2, this.y + this.h * 0.68, this.locked ? `${this.theme.score / 1000}k` : 'ok', {
              size: Math.round(F * 0.8), color: PALETTE.dim, maxWidth: this.w - 8
            });
          }
        }

        class ThemesScene extends Scene {
          constructor() {
            super('Themes');
          }

          build() {
            const lines = Math.ceil(THEMES.length / THEME_COLUMNS);
            const heights = [
              Math.round(F * 2.1),
              Math.round(F * 1.2),
              lines * THEME_CARD_H + (lines - 1) * THEME_GAP,
              BTN_H
            ];
            const rows = layoutColumn(PAD, VIEW_H - PAD, heights);

            this.titleY = rows[0];
            this.subtitleY = rows[1];

            const gridTop = rows[2] - (lines * THEME_CARD_H + (lines - 1) * THEME_GAP) / 2;
            const totalW = THEME_CARD_W * THEME_COLUMNS + THEME_GAP * (THEME_COLUMNS - 1);
            const gridLeft = VIEW_W / 2 - totalW / 2;

            THEMES.forEach((theme, index) => {
              const locked = run.highScore < theme.score;
              const x = gridLeft + (index % THEME_COLUMNS) * (THEME_CARD_W + THEME_GAP);
              const y = gridTop + Math.floor(index / THEME_COLUMNS) * (THEME_CARD_H + THEME_GAP);
              this.add(new ThemeCard(this, theme, index, locked, x, y));
            });

            this.button(VIEW_W / 2, rows[3], 'back', () => this.start('Menu'));
          }

          choose(index) {
            run.themeIndex = index;
            save.theme = index;
            buildTextures(THEMES[index].colors);
            this.restart();
          }

          render() {
            this.clear();
            const colors = this.colors;

            label(VIEW_W / 2, this.titleY, 'KuruKuru Chase!!', {
              size: F * 2, color: colors.text, maxWidth: VIEW_W - PAD * 2
            });
            label(VIEW_W / 2, this.subtitleY, 'select theme', {
              size: Math.round(F * 0.9), color: colors.text
            });

            this.drawWidgets();
          }
        }

        const FRAME_LIMITS = [
          {label: '30', value: 30},
          {label: '60', value: 60},
          {label: 'max', value: 0}
        ];

        class OptionsScene extends Scene {
          constructor() {
            super('Options');
          }

          build() {
            const heights = [
              Math.round(F * 2.1),
              Math.round(F * 1.2), BTN_H,
              Math.round(F * 1.2), BTN_H,
              BTN_H, BTN_H
            ];
            const rows = layoutColumn(PAD, VIEW_H - PAD, heights);

            this.titleY = rows[0];
            this.crtY = rows[1];
            this.limitY = rows[3];

            this.crtButton = this.button(VIEW_W / 2, rows[2], this.crtLabel(), () => {
              save.crt = !save.crt;
              setCrt(save.crt);
              this.restart();
            }, {active: save.crt});

            const width = (BTN_W - PAD * 2) / 3;
            FRAME_LIMITS.forEach((option, i) => {
              const x = VIEW_W / 2 - BTN_W / 2 + width / 2 + i * (width + PAD);
              this.button(x, rows[4], option.label, () => {
                setFrameLimit(option.value);
                this.restart();
              }, {width, active: save.fpsLimit === option.value});
            });

            this.fullscreenButton = this.button(VIEW_W / 2, rows[5], fullscreenLabel(), toggleFullscreen);

            this.button(VIEW_W / 2, rows[6], 'back', () => this.start('Menu'));
          }

          crtLabel() {
            return save.crt ? 'on' : 'off';
          }

          // requestFullscreen resolves after the click handler has returned, so
          // the label can only be trusted once the browser reports the change.
          fullscreenChanged() {
            if (this.fullscreenButton) this.fullscreenButton.setLabel(fullscreenLabel());
          }

          render() {
            this.clear();

            label(VIEW_W / 2, this.titleY, 'KuruKuru Chase!!', {
              size: F * 2, color: this.colors.text, maxWidth: VIEW_W - PAD * 2
            });
            label(VIEW_W / 2, this.crtY, 'crt filter', {size: Math.round(F * 0.9), color: PALETTE.dim});
            label(VIEW_W / 2, this.limitY, 'frame limit', {size: Math.round(F * 0.9), color: PALETTE.dim});

            this.drawWidgets();
          }
        }

        const DRAFT_CARD_W = Math.min(VIEW_W - PAD * 2, F * 30);
        const DRAFT_CARD_H = Math.round(F * 3.6);
        const DRAFT_ICON = Math.round(DRAFT_CARD_H * 0.6);
        const POP_MS = 300;
        const POP_STAGGER = 120;
        const POP_RISE = 50;
        const EPIC_FLASH_MS = 250;
        const BOB_MS = 130;

        class DraftCard extends Widget {
          constructor(scene, key, index, y) {
            super(VIEW_W / 2 - DRAFT_CARD_W / 2, y - DRAFT_CARD_H / 2, DRAFT_CARD_W, DRAFT_CARD_H, () => scene.pick(key));
            this.scene = scene;
            this.card = CARDS[key];
            this.rarity = RARITY_COLORS[this.card.rarity] || PALETTE.dim;
            this.delay = index * POP_STAGGER;
            this.enabled = false;
          }

          get elapsed() {
            return clock - this.scene.startedAt - this.delay;
          }

          update() {
            this.enabled = this.elapsed >= POP_MS;
          }

          draw() {
            const elapsed = this.elapsed;
            if (elapsed <= 0) return;

            const progress = Math.min(1, elapsed / POP_MS);
            const eased = 1 - Math.pow(1 - progress, 3);
            const offsetY = POP_RISE * (1 - eased);
            const colors = this.scene.colors;

            ctx.save();
            ctx.globalAlpha = eased;
            ctx.translate(0, Math.round(offsetY));

            let border = this.rarity;
            if (this.hot) border = colors.text;
            else if (this.card.rarity === 'epic' && Math.floor(clock / EPIC_FLASH_MS) % 2 === 1) border = PALETTE.white;

            fillRect(this.x, this.y, this.w, this.h, this.hot ? PALETTE.slate : PALETTE.ink, this.hot ? 0.55 : 0.85);

            ctx.save();
            ctx.beginPath();
            ctx.rect(this.x + 2, this.y + 2, this.w - 4, this.h - 4);
            ctx.clip();
            ctx.globalAlpha = eased * 0.12;
            dither(ctx, this.x + 2, this.y + 2, this.w - 4, this.h - 4, this.rarity, DITHER_CELL);
            ctx.restore();

            strokeRect(this.x, this.y, this.w, this.h, border);

            const centreY = this.y + this.h / 2;
            const bob = this.hot ? this.bobOffset() : 0;
            const icon = TEX.cardIcon.frames[this.card.rarity];
            ctx.drawImage(
              TEX.cardIcon.canvas, icon.x, icon.y, icon.w, icon.h,
              this.x + PAD, Math.round(centreY - DRAFT_ICON / 2 - bob), DRAFT_ICON, DRAFT_ICON
            );

            const textLeft = this.x + PAD * 2 + DRAFT_ICON;
            const tag = this.card.type === 'active' ? `${this.card.rarity} · active` : this.card.rarity;
            const tagWidth = measure(tag, Math.round(F * 0.75));

            label(this.x + this.w - PAD, centreY - this.h * 0.18, tag, {
              size: Math.round(F * 0.75), color: this.rarity, originX: 1, maxWidth: this.w * 0.35
            });

            label(textLeft, centreY - this.h * 0.18, this.card.name, {
              size: F, color: colors.ui, originX: 0,
              maxWidth: this.w - (textLeft - this.x) - PAD * 2 - tagWidth
            });

            label(textLeft, centreY + this.h * 0.22, this.card.desc, {
              size: Math.round(F * 0.85), color: PALETTE.dim, originX: 0,
              maxWidth: this.w - (textLeft - this.x) - PAD
            });

            ctx.restore();
          }

          bobOffset() {
            const phase = (clock % (BOB_MS * 2)) / BOB_MS;
            return 3 * (phase < 1 ? phase : 2 - phase);
          }
        }

        class UpgradeScene extends Scene {
          constructor() {
            super('Upgrade');
          }

          build() {
            audio.setMood('calm');
            this.startedAt = clock;
            this.picked = false;
            this.choices = run.draftChoices();

            const heights = [
              Math.round(F * 1.25),
              Math.round(F * 1.0),
              ...this.choices.map(() => DRAFT_CARD_H),
              ...(this.choices.length === 0 ? [BTN_H] : [])
            ];
            const rows = layoutColumn(PAD, VIEW_H - PAD, heights);

            this.titleY = rows[0];
            this.subtitleY = rows[1];

            this.choices.forEach((key, i) => this.add(new DraftCard(this, key, i, rows[2 + i])));

            if (this.choices.length === 0) {
              this.button(VIEW_W / 2, rows[2], 'onward', () => this.pick(null), {active: true});
            }
          }

          update() {
            for (const widget of this.widgets) {
              if (widget.update) widget.update();
            }
          }

          pick(key) {
            if (this.picked) return;
            this.picked = true;
            if (key) {
              run.takeCard(key);
              audio.pick();
            }
            this.start('Game');
          }

          render() {
            this.clear();

            label(VIEW_W / 2, this.titleY, `floor ${run.floor - 1} banked`, {color: this.colors.accent});
            label(VIEW_W / 2, this.subtitleY, 'pick a card', {
              size: Math.round(F * 0.8), color: PALETTE.dim
            });

            this.drawWidgets();
          }
        }

        class GameOverScene extends Scene {
          constructor() {
            super('GameOver');
          }

          build() {
            audio.setMood('calm');

            const colors = this.colors;
            this.stats = [
              ['score', run.bank, colors.ui],
              ['floor', run.floor, colors.accent],
              ['time', run.finalTime, colors.text],
              ['best streak', run.bestStreak, PALETTE.dim]
            ];
            if (run.lostCarry > 0) this.stats.splice(1, 0, ['left behind', run.lostCarry, PALETTE.rose]);

            const heights = [
              Math.round(F * 2),
              ...this.stats.map(() => Math.round(F * 1.15)),
              BTN_H,
              BTN_H
            ];
            const rows = layoutColumn(PAD, VIEW_H - PAD, heights);

            this.titleY = rows[0];
            this.statRows = rows.slice(1, 1 + this.stats.length);

            const half = (BTN_W - PAD) / 2;
            const buttonY = rows[1 + this.stats.length];

            this.shareButton = this.button(VIEW_W / 2 - BTN_W / 2 + half / 2, buttonY, 'share', async () => {
              const copied = await shareResults();
              this.shareButton.setLabel(copied ? 'copied!' : 'share');
            }, {width: half});

            this.button(VIEW_W / 2 + BTN_W / 2 - half / 2, buttonY, 'save', () => {
              downloadResults(this.colors);
            }, {width: half});

            this.button(VIEW_W / 2, rows[2 + this.stats.length], 'main menu', () => {
              this.start('Menu');
            }, {dim: true});
          }

          render() {
            this.clear();

            label(VIEW_W / 2, this.titleY, 'game over', {
              size: Math.round(F * 1.6), color: PALETTE.danger
            });

            this.stats.forEach(([text, value, color], i) => {
              label(VIEW_W / 2, this.statRows[i], `${text} ${value}`, {
                size: Math.round(F * 0.9), color
              });
            });

            this.drawWidgets();
          }
        }

        const SCENES = {
          Boot: BootScene,
          Menu: MenuScene,
          Themes: ThemesScene,
          Options: OptionsScene,
          Game: GameScene,
          Upgrade: UpgradeScene,
          GameOver: GameOverScene
        };

        const game = {
          scene: null,
          pending: null,

          start(name) {
            this.pending = name;
          },

          step(dt) {
            if (this.pending) {
              const next = this.pending;
              this.pending = null;
              if (this.scene) this.scene.destroy();
              this.scene = new SCENES[next]();
              this.scene.build();
              this.scene.refreshHover();
            }
            if (this.scene) this.scene.update(dt);
          },

          render() {
            if (!this.scene) return;
            this.scene.render();
            if (crt.enabled) presentCrt();
          }
        };

        function stagePoint(event) {
          const box = stage.getBoundingClientRect();
          if (box.width <= 0 || box.height <= 0) return null;
          return {
            x: (event.clientX - box.left) * (VIEW_W / box.width),
            y: (event.clientY - box.top) * (VIEW_H / box.height)
          };
        }

        // Both of these reject asynchronously, so a synchronous try/catch would
        // never see the failure. The lock also has to wait for the element to
        // actually be fullscreen or Android rejects it outright.
        async function goImmersive() {
          try {
            if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
          } catch {
            return;
          }

          try {
            if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
          } catch {}
        }

        async function toggleFullscreen() {
          try {
            if (document.fullscreenElement) await document.exitFullscreen();
            else await document.documentElement.requestFullscreen();
          } catch {}
        }

        function fullscreenLabel() {
          return document.fullscreenElement ? 'exit fullscreen' : 'fullscreen';
        }

        stage.addEventListener('pointerdown', (event) => {
          const point = stagePoint(event);
          if (!point || !game.scene) return;
          stage.setPointerCapture(event.pointerId);
          pointer.x = point.x;
          pointer.y = point.y;
          pointer.id = event.pointerId;
          game.scene.pointerMove(point.x, point.y);
          game.scene.pointerDown(point.x, point.y);
        });

        stage.addEventListener('pointermove', (event) => {
          const point = stagePoint(event);
          if (!point || !game.scene) return;
          pointer.x = point.x;
          pointer.y = point.y;
          pointer.id = event.pointerId;
          game.scene.pointerMove(point.x, point.y);
        });

        const releasePointer = (event) => {
          const point = stagePoint(event);
          if (!point || !game.scene) return;
          pointer.id = event.pointerId;
          game.scene.pointerUp(point.x, point.y);
        };

        // A cancelled pointer is an aborted gesture, not a tap: routing it
        // through pointerUp would fire the widget click sitting under the finger.
        const cancelPointer = () => {
          if (game.scene) game.scene.clearInput();
        };

        stage.addEventListener('pointerup', releasePointer);
        stage.addEventListener('pointercancel', cancelPointer);

        window.addEventListener('keydown', (event) => {
          if (HELD_KEYS.has(event.code)) event.preventDefault();
          if (game.scene) game.scene.keyDown(event);
        });

        window.addEventListener('keyup', (event) => {
          if (game.scene) game.scene.keyUp(event);
        });

        window.addEventListener('blur', () => {
          if (game.scene) game.scene.clearInput();
        });

        window.addEventListener('resize', layout);
        window.addEventListener('orientationchange', layout);
        document.addEventListener('fullscreenchange', () => {
          layout();
          if (game.scene) game.scene.fullscreenChanged();
        });

        let lastFrame = 0;

        function tick(time) {
          requestAnimationFrame(tick);

          const elapsed = time - lastFrame;
          if (frameInterval && elapsed < frameInterval) return;

          lastFrame = time;
          clock = time;

          game.step(Math.min(elapsed / 1000, 0.1));
          game.render();
        }

        initCrt();
        watchContextLoss();
        setCrt(save.crt);
        setFrameLimit(save.fpsLimit);
        layout();
        game.start('Boot');
        requestAnimationFrame(tick);

        window.game = game;
      })();
    </script>
  </body>
</html>
